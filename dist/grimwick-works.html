    var hours = worked ? WAGE.hours : 0;
    var gross = 0;

    /* Piece work. The count you made is the wage you get, and the day money
       is the floor beneath a ruined shift. */
    if (worked) {
      /* the glut does not change your count, only what a count is worth */
      var piece = Math.round((S.pending.pieceWage || 0) * (S.market.wageMult || 1));
      gross = Math.max(WAGE.dayFloor, piece);
    } else if (S.pending.pieceWage > 0) {
      /* a night shift taken while off the roll still pays */
      gross = Math.round(S.pending.pieceWage * (S.market.wageMult || 1));
    }
    if (S.pending.bonus > 0) gross += S.pending.bonus;
    /* a child's wage is paid to the head of the household. that is the law. */
    if (S.pending.kinWage > 0) gross += S.pending.kinWage;

    var lines = [];
    function add(key, amount, params) {
      if (amount > 0) lines.push({ key: key, amount: amount, params: params || null });
    }

    add(CHARGES.lampOil.key, CHARGES.lampOil.base + (S.flags.lampOilUp ? 1 : 0));
    add(CHARGES.toolHire.key, CHARGES.toolHire.base);

    /* breakages: what you broke, plus what they say you broke */
    var breakages = S.pending.breakages;
    if (worked && Util.chance(0.28)) breakages += Util.rndInt(1, 5);
    /* and now and then, a charge that swallows the day whole: a cracked
       wheel, a bent die, a crate of caps condemned at inspection */
    if (worked && Util.chance(0.07)) breakages += Util.rndInt(12, 26);
    add(CHARGES.breakages.key, breakages);

    /* fines accrued today */
    for (var i = 0; i < S.pending.fines.length; i++) {
      var f = FINES[S.pending.fines[i]];
      if (f) add(f.key, f.amount);
    }
    if (!worked && S.job.employed) add(FINES.absent.key, FINES.absent.amount);

    /* subscriptions */
    if (S.time.day % 7 === 6) add(CHARGES.burialClub.key, CHARGES.burialClub.base);
    if (S.time.day % 7 === 0) add(CHARGES.chapelRate.key, CHARGES.chapelRate.base);

    /* the doctor's book has a long memory */
    if (S.flags.doctorsBookDays > 0) {
      add(CHARGES.doctorsBook.key, 3);
      S.flags.doctorsBookDays -= 1;

      S.house.arrears -= stop;
      if (S.house.arrears <= 0) { S.house.arrears = 0; S.flags.rentAtSource = false; }
    }

    /* condemned pieces, charged at the value of the article */
    if (S.pending.spoilage > 0) add(CHARGES.spoilage.key, S.pending.spoilage);

    /* the week's count came up short */
    if (S.pending.quotaFine > 0) add(CHARGES.quotaFine.key, S.pending.quotaFine);

    /* charges Coom writes in because he can */
    var skims = Coom.skims();
    for (var k = 0; k < skims.length; k++) add(skims[k].key, skims[k].amount);

    /* the company store takes its cut off the top */
    if (S.purse.debt > 0) {
      var take = Math.max(2, Math.round(gross * 0.15));
      take = Math.min(take, S.purse.debt);
      add(CHARGES.store.key, take);
      S.storeTakeThisDay = take;
    } else {
      S.storeTakeThisDay = 0;
    }

    for (var j = 0; j < lines.length; j++) deducted += lines[j].amount;

    var net = gross - deducted;

    return {
      day: S.time.day,
      season: S.time.season,
      weather: S.time.weather,
      worked: worked,
      hours: hours,
      stationKey: 'shift.stations.' + S.factory.station + '.name',
      pieces: S.factory.shift ? S.factory.shift.good : 0,
      unitKey: 'shift.stations.' + S.factory.station + '.units',
      orderId: S.factory.shift ? S.factory.shift.order : (S.factory.order || null),
      bonus: S.pending.bonus,
      kinWage: S.pending.kinWage,
      kinName: State.kin() ? State.kin().name : '',
      gross: gross,
      lines: lines,
      deducted: deducted,
      net: net,
      carried: net < 0 ? -net : 0,
      debtBefore: S.purse.debt,
      debtAfter: 0,
      noteKey: null

  },

  /* Pay it in, or write it up. Returns the settled docket. */
  settle: function (docket) {
    /* the store's cut comes off the book */
    if (S.storeTakeThisDay) {
      S.purse.debt = Math.max(0, S.purse.debt - S.storeTakeThisDay);
      S.storeTakeThisDay = 0;
    }
    if (docket.net > 0) {
      S.purse.pennies += docket.net;
    } else if (docket.net < 0) {
      /* a week where the charges beat the wage. it happens. it is legal. */
      S.purse.debt += -docket.net;
    }
    docket.debtAfter = S.purse.debt;
    docket.noteKey = Narrative.bodyNoteKey(docket);

    S.ledger.grossTotal += docket.gross;
    S.ledger.deductTotal += docket.deducted;
    S.ledger.netTotal += docket.net;
    if (docket.worked) S.ledger.daysWorked += 1;

    S.docket = docket;
    S.dockets.push({ day: docket.day, gross: docket.gross, net: docket.net });
    if (S.dockets.length > 70) S.dockets.shift();

    /* charges are settled; tomorrow starts its own tab */
    S.pending.fines = [];
    S.pending.breakages = 0;
    S.pending.extra = [];
    S.pending.pieceWage = 0;
    S.pending.kinWage = 0;
    S.pending.bonus = 0;
    S.pending.quotaFine = 0;
    S.pending.spoilage = 0;

    if (b.warmth < 22) return 'docket.bodyNotes.cold';

  /* The next dated thing that will happen to you whether you are ready or not. */
  deadline: function () {
    var candidates = [];
    if (S.house.rentDue >= S.time.day) {
      candidates.push({
        day: S.house.rentDue,
        key: 'goals.deadline_rent',
        params: { d: S.house.rentDue, amt: Economy.money(S.house.rentAmount) }
      });
    }
    if (S.purse.debt > 0) {
      var nextSunday = S.time.day + (7 - (S.time.day % 7)) % 7;
      if (nextSunday <= S.time.day) nextSunday += 7;
      candidates.push({ day: nextSunday, key: 'goals.deadline_debt', params: { d: nextSunday } });
    }
    if (S.job.employed) {
      var qd = S.time.day + (7 - (S.time.day % 7)) % 7;
      if (qd < S.time.day) qd += 7;
      if (qd === S.time.day - 0 && S.time.day % 7 !== 0) qd += 7;
      candidates.push({
        day: qd,
        key: 'goals.deadline_quota',
        params: { d: qd, n: Math.max(0, S.factory.quota.target - S.factory.quota.made) }
      });
    }
    if (S.time.act === 1) {
      candidates.push({ day: 21, key: 'goals.deadline_act', params: { d: 21 } });
    }
    if (!candidates.length) return { key: 'goals.deadline_none' };
    candidates.sort(function (a, b) { return a.day - b.day; });
    return candidates[0];
  },

  /* Flavour for the shift, chosen by station. */
  stationLineKey: function () {
    return 'shift.stations.' + S.factory.station + '.line';
  },

  stationNameKey: function () {
    return 'shift.stations.' + S.factory.station + '.name';
  },

  /* Which death is claiming you. The proximate cause is recorded on the body
     as it happens; the checks below only cover deaths with no single blow. */
  deathId: function () {
    var harm = { starve: 'death_starve', cold: 'death_cold', injury: 'death_injury', sick: 'death_sick' };
    if (S.body.lastHarm && harm[S.body.lastHarm]) return harm[S.body.lastHarm];
    if (S.body.hunger >= 96) return 'death_starve';
    if (S.body.warmth <= 4) return 'death_cold';
    if (S.body.injury) return 'death_injury';
    if (S.body.dust >= 80) return 'death_sick';
    if (S.house.larder <= 0 && S.body.hunger > 70) return 'death_starve';
    return 'death_sick';
  },

  /* What the town looks like, for the objectives panel. In-world only. */
  worldLine: function () {
    var signs = Empire.signs();
    return signs.length ? signs[0] : '';
  }
};

/* ==========================================================================
   ENDINGS — chosen by what you built, resolved by what it cost.
   ========================================================================== */
var Endings = {

  /* The strike is called at the reckoning if there is anything to call. */
  callStrike: function () {
    var u = S.tracks.union;
    if (!u.joined || u.struck) return false;
    if (u.meetings < 2 && u.dues < 2) return false;
    u.struck = true;
    S.flags.strikeCalled = true;
    State.applyStanding({ notice: 12, foreman: -20 });
    return true;
  },

  /* Whether it held. Numbers the player has been able to feel all game:
     how the floor stands with you, what the fund holds, whether the town
     was angry enough, and whether anybody gave names. */
  strikeHeld: function () {
    var u = S.tracks.union;
    var score = 0;
    if (S.standing.workmates >= 35) score += 2;
    if (S.standing.workmates >= 60) score += 1;
    if (u.dues >= 3) score += 1;
    if (u.meetings >= 3) score += 1;
    if (S.empire.unrest >= 45) score += 1;
    if (S.tracks.informant.names.length > 0) score -= 3;
    if (u.exposed) score -= 2;
    return score >= 4;
  },

  /* The service does not care what you chose. It cares what you arrived as. */
  shillingEpilogue: function () {
    if (S.body.dust >= 55 || S.body.health <= 32 || S.body.lead >= 55) return 'invalided';
    if (S.mind.literacy >= 2 && S.mind.resolve >= 45 && S.body.tremor < 45) return 'promoted';
    if (S.body.health <= 55 || S.body.tremor >= 55) return 'died';
    return 'survived';
  },

  /* Everyone you named gets a fate, and the fate is always shown. */
  assignFates: function () {
    var names = S.tracks.informant.names;
    for (var i = 0; i < names.length; i++) {
      if (names[i].fate) continue;
      var u = S.empire.unrest;
      var f;
      if (u >= 72 && S.empire.gallows && Util.chance(0.35)) f = 'hanged';
      else if (u >= 52) f = Util.chance(0.55) ? 'transported' : 'gaoled';
      else if (u >= 32) f = Util.chance(0.5) ? 'gaoled' : 'blacklisted';
      else f = Util.chance(0.6) ? 'blacklisted' : 'released';
      names[i].fate = f;
      names[i].fateDay = S.time.day;
    }
    return names;
  },

  fatesToShow: function () {
    var out = [], names = S.tracks.informant.names;
    for (var i = 0; i < names.length; i++) {
      if (names[i].fate && !names[i].shown) out.push(names[i]);
    }
    return out;
  },

  fateLine: function (entry) {
    var def = INFORMANT_FATES[entry.fate];
    if (!def) return '';
    return interpolate(def.line, { name: entry.name });
  },

  /* Which ending this is. Order matters: the rope first, then the grave. */
  pick: function () {
    if (S.flags.condemned) return 'the_drop';
    if (S.dead) return 'broken';
    if (S.tracks.enlist.joined) return 'the_shilling';
    if (S.tracks.emigrate.booked && (!State.kinPresent() || S.tracks.emigrate.kinBooked)) return 'passage';
    if (S.tracks.informant.names.length > 0 && S.standing.foreman > 70) return 'foremans_chair';
    if (S.tracks.informant.names.length > 0) return 'queens_evidence';
    if (S.tracks.union.struck) return Endings.strikeHeld() ? 'strike_holds' : 'strike_breaks';
    return 'the_machine';
  },

  /* The four things every ending screen shows, whatever the ending is. */
  account: function () {
    var k = State.kin();
    var damage = [];
    if (S.body.dust > 5) damage.push(T('endings.dmgDust', { n: Math.round(S.body.dust), band: band(S.body.dust, 'dust') }));
    if (S.body.tremor > 5) damage.push(T('endings.dmgTremor', { n: Math.round(S.body.tremor), band: band(S.body.tremor, 'tremor') }));
    if (S.body.lead > 5) damage.push(T('endings.dmgLead', { n: Math.round(S.body.lead), band: band(S.body.lead, 'lead') }));
    for (var i = 0; i < S.body.scars.length; i++) {
      damage.push(T('endings.dmgScar', { what: T('injuries.' + S.body.scars[i].type) }));
    }
    if (!damage.length) damage.push(T('endings.dmgNone'));

    var kinLine;
    if (!k) kinLine = T('endings.kinNone');
    else if (k.status === 'DEAD') kinLine = T('endings.kinDead', { name: k.name });
    else if (k.status === 'TAKEN') kinLine = T('endings.kinTaken', { name: k.name });
    else if (S.tracks.emigrate.kinBooked) kinLine = T('endings.kinSailed', { name: k.name });
    else if (k.working) kinLine = T('endings.kinWorking', { name: k.name, n: Math.round(k.tremor || 0) });
    else kinLine = T('endings.kinAlive', { name: k.name, band: band(k.health, 'health') });

    Endings.assignFates();
    var names = [];
    for (var j = 0; j < S.tracks.informant.names.length; j++) {
      names.push(Endings.fateLine(S.tracks.informant.names[j]));
    }

    return {
      days: S.time.day,
      damage: damage,
      kin: kinLine,
      names: names,
      earned: S.ledger.grossTotal,
      stopped: S.ledger.deductTotal,
      debt: S.purse.debt
    };
  }
};

/* ---- js/empire.js ---- */
/* ==========================================================================
   GRIMWICK WORKS — js/empire.js
   The Mountain War, the scarcity, the unrest and the levy.

   The player never sees these numbers and never will. They see a broadsheet
   they may not be able to read, a tavern where three rumours in ten are
   false and none of them are labelled, and a town with more soldiers in it
   than there were last month.
   ========================================================================== */

var METER_BANDS = ['none', 'low', 'rising', 'high', 'total'];

var Empire = {

  /* ---------------------------------------------------------------- bands */
  band: function (value) {
    if (value >= 78) return 'total';
    if (value >= 56) return 'high';
    if (value >= 34) return 'rising';
    if (value >= 15) return 'low';
    return 'none';
  },

  bandOf: function (meter) { return Empire.band(S.empire[meter] || 0); },

  /* Kept for the market board's one-line headline. */
  newsBand: function () {
    var w = S.empire.war;
    if (w >= 78) return 'total';
    if (w >= 58) return 'hard';
    if (w >= 38) return 'open';
    if (w >= 18) return 'rumour';
    return 'quiet';
  },

  /* ---------------------------------------------------------------- weekly
     The four meters move together, because they are the same war seen from
     four different windows.
     -------------------------------------------------------------------- */
  week: function () {
    var e = S.empire;
    e.week += 1;

    var actPush = (S.time.act - 1) * 3;
    e.war = Util.clamp100(e.war + Util.rndInt(-2, 5) + actPush);

    /* an army eats first, and what it does not eat it requisitions */
    e.scarcity = Util.clamp100(e.scarcity + Util.rndInt(-3, 4) + Math.round(e.war / 22));
    if (S.time.season === 'WINTER') e.scarcity = Util.clamp100(e.scarcity + 3);

    /* hungry towns are restless towns, and the garrison reads the same figures */
    e.unrest = Util.clamp100(e.unrest + Util.rndInt(-3, 3) + Math.round(e.scarcity / 25)
      + (S.flags.strikeCalled ? 12 : 0));

    /* the levy follows the casualty lists, at about a month's delay */
    e.levy = Util.clamp100(e.levy + Util.rndInt(-2, 4) + Math.round(e.war / 26));

    /* the glut is the other end of the levy: men released, men returned */
    e.glut = Util.clamp100(e.glut + Util.rndInt(-2, 3) + (e.war > 60 ? 2 : 0));

    /* what the town can see without being told anything */
    e.patrols = 1 + (e.unrest >= 34 ? 1 : 0) + (e.unrest >= 56 ? 1 : 0) + (e.unrest >= 78 ? 1 : 0);
    if (!e.gallows && e.unrest >= 62) {
      e.gallows = true;
      S.flags.gallowsRaised = true;
      UI.log(T('world.gallowsRaised'), 'bad');
    }

    Economy.recomputeMarket();
    return e;
  },

  /* ---------------------------------------------------------------- daily */
  tick: function () {
    /* attention fades if you give it nothing to look at, and slowly */
    if (S.standing.notice > 0 && Util.chance(0.4)) {
      S.standing.notice = Util.clamp100(S.standing.notice - 1);
    }
    if (S.flags.carryingPrint) S.standing.notice = Util.clamp100(S.standing.notice + 2);
    if (S.flags.holdingParcel) S.standing.notice = Util.clamp100(S.standing.notice + 1);
    if (S.standing.garrison < -40) S.standing.notice = Util.clamp100(S.standing.notice + 1);
    if (S.tracks.union.joined && S.empire.unrest >= 56) S.standing.notice = Util.clamp100(S.standing.notice + 1);
  },

  /* --------------------------------------------------------------- signs
     What the town looks like this week. In-world only.
     ------------------------------------------------------------------- */
  signs: function () {
    var out = [];
    var e = S.empire;
    out.push(T('world.patrols.' + Math.min(3, e.patrols - 1)));
    out.push(T('world.shelves.' + Empire.band(e.scarcity)));
    if (e.gallows) out.push(T('world.gallows'));
    if (e.levy >= 70) out.push(T('world.pressGang'));
    else if (e.levy >= 45) out.push(T('world.recruiters'));
    if (e.unrest >= 56) out.push(T('world.unrest'));
    return out;
  },

  /* ---------------------------------------------------------- broadsheet
     The truth, in print, for anybody who can read print.
     ------------------------------------------------------------------- */
  broadsheet: function () {
    var out = [];
    out.push(T('broadsheet.war.' + Empire.bandOf('war')));
    out.push(T('broadsheet.scarcity.' + Empire.bandOf('scarcity')));
    out.push(T('broadsheet.unrest.' + Empire.bandOf('unrest')));
    out.push(T('broadsheet.levy.' + Empire.bandOf('levy')));
    S.empire.lastHeadlines = out;
    S.flags.readBroadsheet = (S.flags.readBroadsheet || 0) + 1;
    return out;
  },

  /* ------------------------------------------------------------- rumours
     Three in ten are false. The game does not know how to tell you which,
     because nobody in the Black Ewe knows either.
     ------------------------------------------------------------------- */
  rumour: function () {
    var meters = ['war', 'scarcity', 'unrest', 'levy'];
    var meter = meters[Util.rndInt(0, meters.length - 1)];
    var trueBand = Empire.bandOf(meter);
    var isTrue = !Util.chance(0.3);
    var band = trueBand;

    if (!isTrue) {
      /* a false rumour is a true-sounding one about the wrong state of the
         world: the same voice, the same confidence, the wrong band */
      var idx = METER_BANDS.indexOf(trueBand);
      var wrong = idx;
      while (wrong === idx) wrong = Util.rndInt(0, METER_BANDS.length - 1);
      band = METER_BANDS[wrong];
    }

    var pool = T('rumours.' + meter + '.' + band);
    var text = (pool && pool.length) ? pool[Util.rndInt(0, pool.length - 1)] : T('rumours.generic');

    /* recorded for the historian, never for the player */
    S.flags.rumoursHeard = (S.flags.rumoursHeard || 0) + 1;
    return { text: text, meter: meter, wasTrue: isTrue };
  },

  /* ---------------------------------------------------------- the garrison
     watched 30 / searched 55 / arrested 75 / hanged 90
     ------------------------------------------------------------------- */
  noticeBand: function () {
    var n = S.standing.notice;
    if (n >= 90) return 'hanged';
    if (n >= 75) return 'arrested';
    if (n >= 55) return 'searched';
    if (n >= 30) return 'watched';
    return 'unknown';
  },

  contraband: function () {
    var items = [];
    if (S.flags.carryingPrint) items.push('print');
    if (S.flags.holdingParcel) items.push('parcel');
    if ((S.flags.hasBrass || 0) > 0) items.push('brass');
    if (S.flags.stealingCaps) items.push('caps');
    return items;
  },

  /* Called at the top of every day. This is where the meters arrive at the
     door, which is the only way the player ever meets them. */
  garrisonDay: function () {
    if (S.dead || S.arrest) return null;
    var band = Empire.noticeBand();
    var pressure = 1 + S.empire.unrest / 90;

    if (band === 'hanged') {
      /* there is a rope up in the square and your name is on the calendar */
      S.flags.condemned = true;
      return { kind: 'hanged' };
    }

    if (band === 'arrested' && Util.chance(0.42 * pressure)) {
      return { kind: 'arrested' };
    }

    if (band === 'searched' && Util.chance(0.34 * pressure)) {
      return { kind: 'searched', found: Empire.contraband() };
    }

    if (band === 'watched' && Util.chance(0.28 * pressure)) {
      return { kind: 'watched' };
    }

    /* the press gang works Grimwick when the levy is high enough */
    if (S.empire.levy >= 70 && S.job.employed === false && Util.chance(0.2)) {
      return { kind: 'pressgang' };
    }
    return null;
  },

  /* Taken up. Days in the cells, shifts lost, and a charge that decides
     whether you come out at all. */
  arrest: function (charge) {
    var days = Util.rndInt(2, 4);
    var seditious = charge === 'sedition';
    S.arrest = { day: S.time.day, daysHeld: days, charge: charge || 'suspicion' };
    S.flags.arrested = (S.flags.arrested || 0) + 1;
    S.standing.notice = Util.clamp100(S.standing.notice - (seditious ? 4 : 12));
    State.applyStanding({ garrison: -10, foreman: -8 });
    State.applyMind({ resolve: -10 });
    if (S.job.employed) {
      S.job.warnings += 1;
      S.job.lastWarningDay = S.time.day;
      if (S.job.warnings >= QUOTA.warningsToDismissal) {
        S.job.employed = false;
        S.flags.sacked = true;
      }
    }
    return S.arrest;
  },

  releaseCheck: function () {
    if (!S.arrest) return false;
    if (S.time.day - S.arrest.day < S.arrest.daysHeld) return false;
    var charge = S.arrest.charge;
    S.arrest = null;
    S.flags.released = (S.flags.released || 0) + 1;
    if (charge === 'sedition' && S.tracks.informant.names.length === 0 && Util.chance(0.35)) {
      /* committed for trial. the assizes are not in Grimwick and neither are you */
      S.flags.committed = true;
    }
    return true;
  }
};

/* ==========================================================================
   THE ACTS — on schedule, or on the trigger, whichever comes first.
   ========================================================================== */
var Acts = {

  ACT1_END_DAY: 20,
  ACT2_END_DAY: 45,

  /* Called every morning. Returns an id when the world turns over. */
  check: function () {
    if (S.time.act === 1 && (S.time.day > Acts.ACT1_END_DAY || S.empire.war >= 55)) {
      return Acts.beginAct2();
    }
    if (S.time.act === 2 && (S.time.day > Acts.ACT2_END_DAY || Acts.act3Trigger())) {
      return Acts.beginAct3();
    }
    return null;
  },

  act3Trigger: function () {
    return !!(S.flags.strikeCalled || S.tracks.emigrate.booked || S.tracks.enlist.joined
      || S.flags.committed || S.flags.condemned);
  },

  /* The retooling: quotas double, three floors go. */
  beginAct2: function () {
    S.time.act = 2;
    S.flags.retooling = true;
    S.flags.act2Day = S.time.day;

    S.factory.quota.target = Math.round(S.factory.quota.target * 2);
    S.factory.quota.lastTarget = Math.round(S.factory.quota.target / 2);

    /* three floors laid off. the roster shortens and everyone counts it. */
    var laid = [];
    for (var i = 0; i < S.factory.floor.length && laid.length < 3; i++) {
      var h = S.factory.floor[i];
      if (h.alive && !h.laidOff && h.station !== S.factory.station) {
        h.laidOff = true;
        laid.push(h.name);
      }
    }
    S.flags.laidOff = laid;
    State.applyStanding({ workmates: -6 });
    State.applyMind({ resolve: -8 });

    /* and the roads out become visible, because people start taking them */
    S.tracks.union.known = true;
    S.tracks.informant.known = true;
    S.tracks.enlist.known = true;
    S.tracks.emigrate.known = true;
    S.tracks.criminal.known = true;

    return { id: 'retooling', laid: laid };
  },

  beginAct3: function () {
    S.time.act = 3;
    S.flags.act3Day = S.time.day;
    S.flags.reckoning = true;
    /* whatever was being built is called in now */
    var struck = Endings.callStrike();
    Endings.assignFates();
    return { id: 'reckoning', struck: struck };
  },

  /* Which roads the player is actually on. */
  active: function () {
    var out = [];
    for (var k in S.tracks) {
      if (Object.prototype.hasOwnProperty.call(S.tracks, k) && S.tracks[k].joined) out.push(k);
    }
    return out;
  }
};

/* ==========================================================================
   GRIMWICK WORKS — js/factory.js
   The twelve hours. Three dials, four floors, one count, one overseer.

   The shift resolves in full before a single beat-line is shown, so a player
   who closes the tab mid-animation loses nothing and gains nothing.
   ========================================================================== */

var STATION_SEVERE = {
  CASTING:  'scald',
  CAP_BENCH:'burn',
  GRINDING: 'wheelSplinter',
  STAMPING: 'lostFingers'
};

var CATASTROPHE_INJURY = {
  flash:         'fulminateFlash',
  burst:         'wheelSplinter',
  cruciblespill: 'scald',
  press:         'lostFingers'
};

/* Foreman standing needed before Coom will move you there. Nobody has to be
   persuaded to let you into the stamping shop. */
var TRANSFER_GATE = { CASTING: 25, CAP_BENCH: -20, GRINDING: -40, STAMPING: -100 };

var RARITY_WEIGHT = { COMMON: 60, UNCOMMON: 22, FINE: 12, RARE: 5, PROTOTYPE: 2 };

var Factory = {

  def: function (station) { return STATION_DEF[station || S.factory.station]; },

  /* ---------------------------------------------------------- day order
     The Ordnance Division sends down what it wants made. Common ball most
     days. Now and then a breech block for a pattern with no name, worth
     eleven times the ball and charged at eleven times the ball if you
     spoil one.
     ------------------------------------------------------------------- */
  order: function () {
    var o = S.factory.order && ORDERS[S.factory.order];
    return o || ORDERS.ball_common;
  },

  eligibleOrders: function (station) {
    var out = [], id;
    for (id in ORDERS) {
      if (!Object.prototype.hasOwnProperty.call(ORDERS, id)) continue;
      var o = ORDERS[id];
      if (o.stations.indexOf(station) < 0) continue;
      if (o.minAct && S.time.act < o.minAct) continue;
      if (o.requiresWar && S.empire.war < o.requiresWar) continue;
      out.push(o);
    }
    return out;
  },

  assignOrder: function () {
    var pool = Factory.eligibleOrders(S.factory.station);
    if (!pool.length) { S.factory.order = 'ball_common'; return; }
    var weights = [], total = 0, i;
    for (i = 0; i < pool.length; i++) {
      var w = RARITY_WEIGHT[pool[i].rarity] || 10;
      /* a war wants the new patterns, and wants them faster than it can gauge them */
      if (pool[i].rarity === 'PROTOTYPE' || pool[i].rarity === 'RARE') w *= 1 + S.empire.war / 60;
      if (pool[i].rarity === 'COMMON') w *= 1 + S.empire.levy / 90;
      weights.push(w);
      total += w;
    }
    var r = Util.rnd() * total, pick = pool[pool.length - 1];
    for (i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) { pick = pool[i]; break; }
    }
    S.factory.order = pick.id;
    if (RARITY[pick.rarity].rank >= 3) S.flags.sawRareOrder = (S.flags.sawRareOrder || 0) + 1;
  },
  skill: function (station) { return S.factory.skills[station || S.factory.station] || 0; },

  /* ---------------------------------------------------------------- dials */
  setDial: function (kind, value) {
    if (S.factory.worked || S.time.phase !== 'SHIFT') return false;
    if (kind === 'pace' && PACE[value]) S.factory.pace = value;
    else if (kind === 'care' && CARE[value]) S.factory.care = value;
    else if (kind === 'guard' && GUARD[value]) S.factory.guard = value;
    else return false;
    Audio.dial();
    return true;
  },

  /* ---------------------------------------------------------- assignment */
  assignStation: function () {
    /* You stay where you are. Coom moves you only to make a point. */
    if (S.foreman.spiteUntil >= S.time.day) {
      var worst = Factory.skill('STAMPING') <= Factory.skill('GRINDING') ? 'STAMPING' : 'GRINDING';
      if (S.factory.station !== worst) {
        S.factory.station = worst;
        S.flags.spitedToStation = true;
      }
    }
    if (!STATION_DEF[S.factory.station]) S.factory.station = 'CAP_BENCH';
  },

  canWork: function () {
    if (S.time.phase !== 'SHIFT') return 'disabled.notEvening';
    if (S.factory.worked) return 'disabled.shiftDone';
    if (!S.job.employed) return 'disabled.sacked';
    return true;
  },

  /* ------------------------------------------------------------- the math
     Condition multiplier: everything the body and the week are doing to your
     hands before you have made a single piece.
     --------------------------------------------------------------------- */
  condition: function (station) {
    var b = S.body, c = 1;
    if (b.hunger > 80) c -= 0.15; else if (b.hunger > 60) c -= 0.08;
    if (b.warmth < 30) c -= 0.06;
    c -= (b.fatigue / 100) * 0.22;
    if (b.injury) c -= (INJURY_DEF[b.injury.type] ? INJURY_DEF[b.injury.type].output : 0.08);
    if (b.injury && b.injury.fever) c -= 0.15;
    c -= State.scarPenalty();
    if (station === 'CAP_BENCH') c -= (b.tremor / 100) * 0.30;
    if (station === 'GRINDING') c -= (b.tremor / 100) * 0.12 + (b.dust / 100) * 0.15;
    if (station === 'CASTING' && b.lead > 40) c -= 0.06;
    if (b.lead > 40) c -= 0.05;                 /* the colic, and the fog with it */
    if (S.mind.resolve < 25) c -= 0.05;
    return Util.clamp(c, 0.25, 1.15);
  },

  rejectRate: function (station) {
    var care = CARE[S.factory.care];
    var r = care.reject;
    var skill = Factory.skill(station);
    if (skill < 25) r *= 1.9; else if (skill < 50) r *= 1.35;
    r *= 1 + S.body.fatigue / 300;
    if (station === 'CAP_BENCH') r *= 1 + S.body.tremor / 90;
    if (S.body.lead > 40) r *= 1.15;
    return Util.clamp(r, 0.005, 0.6);
  },

  accidentRisk: function (station) {
    var d = STATION_DEF[station];
    var risk = d.accident
      * PACE[S.factory.pace].accident
      * CARE[S.factory.care].accident
      * GUARD[S.factory.guard].accident
      * (1 - Factory.skill(station) / 160)
      * (1 + S.body.fatigue / 110);
    if (S.body.injury) risk *= 1.35;
    if (S.body.hunger > 75) risk *= 1.2;
    if (station === 'CAP_BENCH' || station === 'GRINDING') risk *= 1 + S.body.tremor / 150;
    if (S.body.lead > 50) risk *= 1.1;
    return Util.clamp(risk, 0, 0.85);
  },

  catastropheRisk: function (station) {
    var d = STATION_DEF[station];
    var r = d.catRisk;
    if (S.factory.guard === 'off') r *= 1.5;
    if (S.factory.pace === 'driven') r *= 1.4;
    if (S.factory.care === 'meticulous') r *= 0.8;
    if (S.factory.care === 'sloppy') r *= 1.2;
    return r;
  },

  /* Deterministic forecast, used by the dials panel and the transfer preview.
     No dice: this is what the player is promised, not what they will get. */
  estimate: function (station, dials) {
    station = station || S.factory.station;
    var d = STATION_DEF[station];
    var keep = { p: S.factory.pace, c: S.factory.care, g: S.factory.guard };
    if (dials) {
      S.factory.pace = dials.pace || keep.p;
      S.factory.care = dials.care || keep.c;
      S.factory.guard = dials.guard || keep.g;
    }
    var ord = Factory.order();
    var skillMult = 0.55 + Factory.skill(station) / 100 * 0.65;
    var output = d.baseOutput * skillMult
      * PACE[S.factory.pace].output * CARE[S.factory.care].output * GUARD[S.factory.guard].output
      * Factory.condition(station) * ord.output;
    output = Math.max(0, Math.round(output));
    var rejects = Math.round(output * Factory.rejectRate(station) * ord.reject);
    var good = Math.max(0, output - rejects);
    var out = {
      station: station,
      order: ord.id,
      rarity: ord.rarity,
      output: output,
      rejects: rejects,
      good: good,
      credits: Math.round(good * d.quotaWeight * ord.quota),
      wage: Math.max(WAGE.dayFloor, Math.round(good * d.pieceRate * ord.value)),
      spoilage: Factory.spoilCharge(output, rejects, ord, Math.max(WAGE.dayFloor, Math.round(good * d.pieceRate * ord.value))),
      accident: Factory.accidentRisk(station),
      catastrophe: Factory.catastropheRisk(station)
    };
    S.factory.pace = keep.p; S.factory.care = keep.c; S.factory.guard = keep.g;
    return out;
  },

  /* ------------------------------------------------------------ the shift */
  resolveShift: function () {
    var station = S.factory.station;
    var d = STATION_DEF[station];
    var beats = [];
    var rec = {
      station: station,
      pace: S.factory.pace, care: S.factory.care, guard: S.factory.guard,
      hours: WAGE.hours,
      output: 0, rejects: 0, good: 0, credits: 0, wage: 0,
      skillBefore: Factory.skill(station), skillGain: 0,
      injury: null, catastrophe: null, nearMiss: false, died: null,
      outcome: 'normal',
      beats: []
    };

    beats.push({ key: 'shift.beats.open.' + station });
    beats.push({ key: 'shift.beats.pace.' + S.factory.pace });
    beats.push({ key: 'shift.beats.care.' + S.factory.care });
    beats.push({ key: 'shift.beats.guard.' + S.factory.guard, kind: S.factory.guard === 'off' ? 'bad' : null });

    /* two beats off this floor, one off the yard */
    var floorBeats = T('shift.beats.' + station);
    var i1 = Util.rndInt(0, floorBeats.length - 1);
    var i2 = (i1 + 1 + Util.rndInt(0, floorBeats.length - 2)) % floorBeats.length;
    beats.push({ text: floorBeats[i1] });
    var common = T('shift.beats.common');
    beats.push({ text: common[Util.rndInt(0, common.length - 1)] });
    beats.push({ text: floorBeats[i2] });

    /* --- output --- */
    var ord = Factory.order();
    rec.order = ord.id;
    rec.rarity = ord.rarity;
    var skillMult = 0.55 + Factory.skill(station) / 100 * 0.65;
    var swing = 0.94 + Util.rnd() * 0.12;
    /* the bench game, bounded: 0.5 is an ordinary pair of hands and resolves
       to exactly 1.00, which is what the sim did before minigames existed */
    var hand = 0.90 + Util.clamp(
      typeof S.factory.handQuality === 'number' ? S.factory.handQuality : 0.5, 0, 1) * 0.20;
    var output = d.baseOutput * skillMult
      * PACE[S.factory.pace].output * CARE[S.factory.care].output * GUARD[S.factory.guard].output
      * Factory.condition(station) * ord.output * swing * hand;
    rec.output = Math.max(0, Math.round(output));
    rec.hand = hand;
    rec.rejects = Math.round(rec.output * Factory.rejectRate(station) * ord.reject);
    rec.good = Math.max(0, rec.output - rec.rejects);
    rec.credits = Math.round(rec.good * d.quotaWeight * ord.quota);
    rec.wage = Math.max(WAGE.dayFloor, Math.round(rec.good * d.pieceRate * ord.value));

    /* The Works allows four in the hundred. Everything condemned above that
       is charged at the value of the article, and on a breech block the value
       of the article is a fortnight. Meticulous work is the only defence. */
    rec.spoilage = Factory.spoilCharge(rec.output, rec.rejects, ord, rec.wage);
    S.pending.spoilage = (S.pending.spoilage || 0) + rec.spoilage;

    /* --- what the floor takes --- */
    var wear = d.wear;
    var fatigue = wear.fatigue * PACE[S.factory.pace].fatigue
      + (S.body.hunger > 60 ? 5 : 0) + (S.body.warmth < 30 ? 4 : 0);
    State.applyBody({
      fatigue: Math.round(fatigue),
      hunger: 26,
      warmth: -6,
      health: wear.health,
      dust: wear.dust,
      tremor: wear.tremor,
      lead: wear.lead
    });
    if (wear.dust) S.body.lastHarm = null;

    /* --- catastrophe, then ordinary accident --- */
    var catRisk = Factory.catastropheRisk(station);
    var accRisk = Factory.accidentRisk(station);

    if (Util.chance(catRisk)) {
      rec.catastrophe = d.catastrophe;
      rec.outcome = 'hurt';
      var victim = Factory.pickNeighbour(station);
      rec.died = victim ? { name: victim.name, age: victim.age } : null;
      if (victim) victim.alive = false;
      Factory.inflict(CATASTROPHE_INJURY[d.catastrophe], rec);
      State.applyMind({ resolve: -18 });
      State.applyStanding({ workmates: 4, notice: 2 });
      S.flags.sawACatastrophe = (S.flags.sawACatastrophe || 0) + 1;
      beats.push({ key: 'shift.beats.hurt', kind: 'cat' });
    } else if (Util.chance(accRisk)) {
      rec.outcome = 'hurt';
      var type = d.injuries[Util.rndInt(0, d.injuries.length - 1)];
      if (S.factory.guard === 'off' && Util.chance(0.45)) type = STATION_SEVERE[station];
      Factory.inflict(type, rec);
      beats.push({ key: 'shift.beats.hurt', kind: 'hurt' });
    } else if (Util.rnd() < accRisk * 1.8) {
      rec.nearMiss = true;
      beats.push({ key: 'shift.beats.nearMiss.' + station, kind: 'bad' });
    }

    /* --- how it read, in the end --- */
    if (rec.outcome !== 'hurt') {
      var expected = d.baseOutput * skillMult;
      if (rec.good > expected * 1.12) rec.outcome = 'good';
      else if (rec.good < expected * 0.78) rec.outcome = 'bad';
    }
    beats.push({ key: 'shift.beats.close.' + rec.outcome, kind: rec.outcome === 'good' ? 'good' : (rec.outcome === 'normal' ? null : 'bad') });

    /* --- the count --- */
    S.factory.quota.made += rec.credits;

    /* --- the hand comes up, slowly --- */
    var gain = Math.max(0.4, 3.2 * (1 - Factory.skill(station) / 100));
    if (S.factory.pace === 'driven') gain *= 0.85;
    if (S.factory.care === 'meticulous') gain *= 1.2;
    S.factory.skills[station] = Util.clamp(Factory.skill(station) + gain, 0, 100);
    rec.skillGain = Math.round((S.factory.skills[station] - rec.skillBefore) * 10) / 10;

    /* --- Coom watches the dials, not the man --- */
    var fm = PACE[S.factory.pace].foreman + CARE[S.factory.care].foreman + GUARD[S.factory.guard].foreman;
    if (fm) State.applyStanding({ foreman: fm });
    if (S.factory.guard === 'off') S.factory.guardsOffShifts += 1;

    S.factory.worked = true;
    S.factory.lastOutcome = rec.outcome;
    rec.beats = beats;
    S.factory.shift = {
      station: rec.station, output: rec.output, rejects: rec.rejects, good: rec.good,
      credits: rec.credits, wage: rec.wage, outcome: rec.outcome, hours: rec.hours,
      order: rec.order, rarity: rec.rarity, spoilage: rec.spoilage,
      skillGain: rec.skillGain, injury: rec.injury, catastrophe: rec.catastrophe,
      died: rec.died, nearMiss: rec.nearMiss, beats: beats
    };

    /* the docket pays piece rate, not a day rate */
    S.pending.pieceWage = rec.wage;

    UI.log(T('shift.workedFor', { h: WAGE.hours, station: T('shift.stations.' + station + '.name') }));
    return rec;
  },

  /* Four in the hundred is the Works' own tolerance. Above it, you pay. */
  spoilCharge: function (output, rejects, ord, wage) {
    var allowance = Math.ceil(output * 0.04);
    var excess = Math.max(0, rejects - allowance);
    return Math.min(Math.round(excess * ord.spoil), Math.max(0, wage));
  },

  /* Whoever is nearest when it goes. Usually somebody's daughter. */
  pickNeighbour: function (station) {
    var here = [], all = [];
    for (var i = 0; i < S.factory.floor.length; i++) {
      var h = S.factory.floor[i];
      if (!h.alive) continue;
      all.push(h);
      if (h.station === station) here.push(h);
    }
    var pool = here.length ? here : all;
    if (!pool.length) return null;
    return pool[Util.rndInt(0, pool.length - 1)];
  },

  inflict: function (type, rec) {
    var def = INJURY_DEF[type];
    if (!def) return;
    rec.injury = type;
    State.injure({
      type: type,
      severity: def.severity,
      daysLeft: def.days,
      permanent: !!def.permanent
    });
    if (S.body.injury && S.body.injury.type === type) {
      S.body.injury.infection = S.body.injury.infection || 0;
      S.body.injury.fever = false;
      S.body.injury.tended = 0;
    }
    State.applyBody({ health: def.health, tremor: def.tremor || 0 });
    S.body.lastHarm = 'injury';
    if (def.scar) State.addScar(type, def.scar);
    State.applyMind({ resolve: -6 });
    UI.log(T('log.hurt', { what: T('injuries.' + type) }), 'bad');
  },

  /* ----------------------------------------------------------- the count */
  quotaProgress: function () {
    var q = S.factory.quota;
    var dayInWeek = ((S.time.day - 1) % 7) + 1;
    return {
      week: q.week,
      target: q.target,
      made: q.made,
      remaining: Math.max(0, q.target - q.made),
      shiftsLeft: Math.max(0, 7 - dayInWeek),
      lastTarget: q.lastTarget
    };
  },

  /* Called at the end of every seventh night. The ratchet lives here. */
  quotaRollover: function () {
    var q = S.factory.quota;
    var beaten = q.made >= q.target;
    var result = {
      week: q.week,
      made: q.made,
      target: q.target,
      beaten: beaten,
      bonus: 0,
      fine: 0,
      next: q.target,
      warnings: S.job.warnings,
      dismissed: false
    };

    if (beaten) {
      result.bonus = QUOTA.bonus;
      S.pending.bonus += QUOTA.bonus;
      /* the ratchet: the figure follows what you proved you could do */
      var byPct = Math.round(q.target * (100 + QUOTA.ratchetPct) / 100);
      var byMade = Math.round(q.made * 1.04);
      result.next = Math.max(byPct, byMade);
      q.weeksBeaten += 1;
      S.job.warnings = Math.max(0, S.job.warnings - 1);
      result.warnings = S.job.warnings;
      State.applyStanding({ foreman: 3 });
    } else {
      result.fine = QUOTA.fine;
      S.pending.quotaFine += QUOTA.fine;
      q.weeksMissed += 1;
      S.job.warnings += 1;
      S.job.lastWarningDay = S.time.day;
      result.warnings = S.job.warnings;
      State.applyStanding({ foreman: -6 });
      State.applyMind({ resolve: -5 });
      if (S.job.warnings >= QUOTA.warningsToDismissal) {
        S.job.employed = false;
        S.flags.sacked = true;
        result.dismissed = true;
      }
    }

    /* a warning three weeks clean falls off the book. Coom does not mention it. */
    if (S.job.warnings > 0 && S.time.day - (S.job.lastWarningDay || 0) >= 21) {
      S.job.warnings -= 1;
      result.warnings = S.job.warnings;
    }

    q.lastTarget = q.target;
    q.lastMade = q.made;
    q.target = result.next;
    q.made = 0;
    q.week += 1;
    q.lastResult = result;
    q.unseen = true;        /* lives in S so a reload cannot lose the reckoning */
    return result;
  },

  /* --------------------------------------------------------- the transfer */
  transferOptions: function () {
    var out = [];
    for (var i = 0; i < STATIONS.length; i++) {
      var st = STATIONS[i];
      var reason = null;
      if (st === S.factory.station) reason = 'shift.transfer.alreadyThere';
      else if (S.standing.foreman < TRANSFER_GATE[st]) reason = 'shift.transfer.needStanding';
      else if (S.factory.transfer && S.factory.transfer.day === S.time.day) reason = 'shift.transfer.pending';
      out.push({ station: st, reason: reason });
    }
    return out;
  },

  transferPreview: function (to) {
    var here = Factory.estimate(S.factory.station);
    var there = Factory.estimate(to);
    return {
      from: S.factory.station,
      to: to,
      fromSkill: Math.round(Factory.skill(S.factory.station)),
      toSkill: Math.round(Factory.skill(to)),
      wageNow: here.wage,
      wageThere: there.wage,
      hazardKey: 'shift.stations.' + to + '.hazard'
    };
  },

  requestTransfer: function (to) {
    if (!STATION_DEF[to] || to === S.factory.station) return { ok: false, key: 'shift.transfer.alreadyThere' };
    if (S.standing.foreman < TRANSFER_GATE[to]) return { ok: false, key: 'shift.transfer.needStanding' };
    if (S.factory.transfer && S.factory.transfer.day === S.time.day) return { ok: false, key: 'shift.transfer.pending' };

    S.factory.transfer = { to: to, day: S.time.day };
    /* he can still say no, and the nearer you are to the line, the likelier */
    var margin = S.standing.foreman - TRANSFER_GATE[to];
    var refuseChance = Util.clamp(0.4 - margin / 100, 0.02, 0.5);
    if (Util.chance(refuseChance)) {
      State.applyStanding({ foreman: -2 });
      return { ok: false, key: 'shift.transfer.refused' };
    }
    S.factory.station = to;
    State.applyStanding({ foreman: -3 });
    S.flags.hasTransferred = true;
    return { ok: true, key: 'shift.transfer.granted' };
  },

  /* ------------------------------------------------------ not going in */
  skipShift: function () {
    S.factory.worked = false;
    S.factory.lastOutcome = 'absent';
    S.factory.shift = null;
    S.pending.pieceWage = 0;
    S.job.shiftsMissed += 1;
    S.job.warnings += 1;
    State.applyStanding({ foreman: -12 });
    State.applyBody({ fatigue: -18, hunger: 12, warmth: -2 });
    State.applyMind({ resolve: -2 });
    UI.log(T('shift.abstained'), 'bad');
    UI.log(T('shift.foremanNotes'));
    if (S.job.warnings >= QUOTA.warningsToDismissal || S.standing.foreman <= -70) {
      S.job.employed = false;
      S.flags.sacked = true;
    }
    return 'absent';
  },

  waitAtGate: function () {
    S.factory.worked = false;
    S.factory.lastOutcome = 'casual';
    S.pending.pieceWage = 0;
    State.applyBody({ fatigue: 8, hunger: 14, warmth: -10 });
    if (Util.chance(0.4)) {
      var pay = Util.rndInt(6, 13);
      State.applyPurse({ pennies: pay });
      UI.log(T('log.gained', { amt: Economy.money(pay) }), 'good');
      return 'casual_got';
    }
    State.applyMind({ resolve: -3 });
    return 'casual_none';
  }
};

/* ==========================================================================
   OVERSEER COOM — a standing meter, not a friend.
   ========================================================================== */
var Coom = {

  moodKey: function () {
    if (S.foreman.spiteUntil >= S.time.day) return 'foreman.blurbSpite';
    if (S.foreman.skimUntil >= S.time.day) return 'foreman.blurbBad';
    if (S.standing.foreman >= 25) return 'foreman.blurbGood';
    return 'foreman.blurbFlat';
  },

  /* What exists at all is gated by standing. Not just how it reads. */
  options: function () {
    var out = [];
    out.push({ id: 'endure', labelKey: 'foreman.endure', hintKey: 'foreman.endureHint', reason: null });

    out.push({
      id: 'flatter', labelKey: 'foreman.flatter', hintKey: 'foreman.flatterHint',
      reason: S.foreman.flatterCooldown >= S.time.day ? 'disabled.askedAlready'
            : (S.standing.foreman <= -55 ? 'disabled.foremanCold' : null)
    });

    out.push({
      id: 'bribe', labelKey: 'foreman.bribe', hintKey: 'foreman.bribeHint',
      params: { amt: Economy.money(12) },
      reason: S.purse.pennies < 12 ? 'disabled.noPennies'
            : (S.foreman.bribedUntil >= S.time.day ? 'disabled.askedAlready' : null)
    });

    /* the letter needs letters, or a scribe who has them */
    var canWrite = S.mind.literacy >= 2;
    out.push({
      id: 'report',
      labelKey: canWrite ? 'foreman.report' : 'foreman.scribe',
      hintKey: canWrite ? 'foreman.reportHint' : 'foreman.scribeHint',
      params: canWrite ? null : { amt: Economy.money(8) },
      reason: S.foreman.reported ? 'disabled.reportedAlready'
            : (!canWrite && S.purse.pennies < 8 ? 'disabled.noScribe' : null)
    });

    return out;
  },

  choose: function (id) {
    var o = null, opts = Coom.options(), i;
    for (i = 0; i < opts.length; i++) if (opts[i].id === id) o = opts[i];
    if (!o || o.reason) return null;

    if (id === 'endure') {
      return 'foreman.r_endure';
    }
    if (id === 'flatter') {
      State.applyStanding({ foreman: 6, workmates: -2 });
      State.applyMind({ resolve: -4 });
      S.foreman.flatterCooldown = S.time.day + 1;
      return 'foreman.r_flatter';
    }
    if (id === 'bribe') {
      Economy.spend(12);
      State.applyStanding({ foreman: 12 });
      S.foreman.bribedUntil = S.time.day + 7;
      S.foreman.skimUntil = 0;
      return 'foreman.r_bribe';
    }
    if (id === 'report') {
      if (S.mind.literacy < 2) Economy.spend(8);
      S.foreman.reported = true;
      S.foreman.inspectorDay = S.time.day + 3;
      S.flags.wroteToInspector = true;
      State.applyStanding({ notice: 6 });
      return 'foreman.r_report';
    }
    return null;
  },

  /* Called at the start of every day. Spite, skimming, and the Inspectorate. */
  tick: function () {
    if (S.standing.foreman <= -30 && S.foreman.skimUntil < S.time.day && Util.chance(0.35)) {
      S.foreman.skimUntil = S.time.day + Util.rndInt(2, 6);
    }
    if (S.standing.foreman <= -45 && S.foreman.spiteUntil < S.time.day && Util.chance(0.3)) {
      S.foreman.spiteUntil = S.time.day + Util.rndInt(2, 5);
    }
  },

  /* The full chain, fired the morning the Inspector arrives. */
  inspectorDue: function () {
    return S.foreman.reported && !S.foreman.inspectorVisited && S.time.day >= S.foreman.inspectorDay;
  },

  inspectorVisit: function () {
    S.foreman.inspectorVisited = true;
    S.flags.inspectorCame = true;
    State.applyStanding({ workmates: -30, foreman: -25, notice: 12 });
    State.applyMind({ resolve: -8 });
    S.foreman.spiteUntil = S.time.day + 12;
    S.foreman.skimUntil = S.time.day + 12;
    UI.log(T('inspector.aftermath'), 'bad');
    return true;
  },

  /* Invented deductions, for the docket. */
  skims: function () {
    if (S.foreman.skimUntil < S.time.day) return [];
    var out = [];
    var n = Util.rndInt(1, 2);
    var pool = COOM_SKIMS.slice();
    for (var i = 0; i < n && pool.length; i++) {
      var idx = Util.rndInt(0, pool.length - 1);
      out.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return out;
  }
};

/* ==========================================================================
   GRIMWICK WORKS — js/town.js
   Eleven nodes, three districts, two hours. Mechanics only: every word the
   player reads comes out of ACTION_TEXT in data/locations.js.
   ========================================================================== */

/* Fill {p}, {n} and {kin} in a line of action text. */
function txt(id, variant, params) {
  var entry = ACTION_TEXT[id];
  if (!entry) return '';
  var line = entry[variant || 'r'];
  if (typeof line !== 'string') return '';
  var k = State.kin();
  var p = params || {};
  if (p.kin === undefined) p.kin = k ? k.name : T('hud.nothing');
  return interpolate(line, p);
}

var TOWN_ACTIONS = {

  /* ================================================================ ROWS */
  rest: {
    ap: 1, at: 'rows',
    enabled: function () { return S.evening.rested ? 'disabled.alreadyRested' : true; },
    run: function () {
      S.evening.rested = true;
      State.applyBody({ fatigue: -14, warmth: S.house.coal > 0 ? 2 : -3 });
      State.applyMind({ resolve: 1 });
      return txt('rest');
    }
  },

  tendKin: {
    ap: 1, at: 'rows',
    enabled: function () { return State.kinPresent() ? true : 'disabled.noKin'; },
    run: function () {
      var k = State.kin();

var Town = {

  locations: function () { return LOCATIONS; },

  location: function (id) {
    for (var i = 0; i < LOCATIONS.length; i++) if (LOCATIONS[i].id === id) return LOCATIONS[i];
    return null;
  },

  /* A node the player can see on the map at all. */
  visible: function (loc) {
    if (!loc.requires) return true;
    if (loc.requires.minAct && S.time.act < loc.requires.minAct) return false;
    if (loc.requires.flag && !S.flags[loc.requires.flag]) return false;
    return true;
  },

  here: function () { return S.evening.at || 'rows'; },

  districtOf: function (id) {
    var loc = Town.location(id);
    return loc ? loc.district : 'CENTRE';
  },

  travelCost: function (toId) {
    var from = Town.districtOf(Town.here());
    var to = Town.districtOf(toId);
    return TRAVEL[from] && typeof TRAVEL[from][to] === 'number' ? TRAVEL[from][to] : 1;
  },

  canTravel: function (toId) {
    var loc = Town.location(toId);
    if (!loc) return 'disabled.noSuchPlace';
    if (S.destitution.workhouse) return 'disabled.inWorkhouse';
    if (!Town.visible(loc)) return 'disabled.notYet';
    if (S.time.phase !== 'EVENING') return 'disabled.notEvening';
    if (toId === Town.here()) return 'disabled.alreadyHere';
    if (S.evening.ap < Town.travelCost(toId)) return 'disabled.noTimeToWalk';
    return true;
  },

  travelTo: function (toId) {
    var ok = Town.canTravel(toId);
    if (ok !== true) return false;
    var cost = Town.travelCost(toId);
    S.evening.ap -= cost;
    S.evening.at = toId;
    Audio.place(toId);
    S.evening.travelled += cost;
    Audio.thunk();
    return true;
  },

  /* Which actions this node offers right now. */
  actionsAt: function (nodeId) {
    if (S.destitution.workhouse) return WORKHOUSE_ACTIONS.slice();
    var loc = Town.location(nodeId);
    if (!loc) return [];
    if (loc.id === 'rows' && !S.house.housed) {
      return loc.streetActions.concat(['tendKin', 'dressWound']);
    }
    var list = loc.actions.slice();
    if (loc.id === 'rows' && State.destitute()) list = list.concat(['begDoorways', 'scavengeRows']);
    return list;
  },

  describe: function (actionId) {
    var def = TOWN_ACTIONS[actionId];
    if (!def) return null;
    var text = ACTION_TEXT[actionId] || {};
    var params = {};
    if (def.price) params.p = Economy.money(def.price());
    var k = State.kin();
    params.kin = k ? k.name : T('hud.nothing');

    var reason = null;
    if (S.time.phase !== 'EVENING') reason = 'disabled.notEvening';
    else if (S.evening.ap < def.ap) reason = 'disabled.noAp';
    else {
      var ok = def.enabled();
      if (ok !== true) reason = ok;
    }

    return {
      id: actionId,
      label: interpolate(text.label || actionId, params),
      hint: interpolate(text.hint || '', params),
      ap: def.ap,
      free: def.ap === 0,
      disabledReason: reason ? T(reason) : null
    };
  },

  perform: function (actionId) {
    var def = TOWN_ACTIONS[actionId];
    var d = Town.describe(actionId);
    if (!def || !d || d.disabledReason) return null;
    var result = def.run();
    S.evening.ap -= def.ap;
    if (def.ap > 0) Audio.thunk();
    if (result && result.open) return result;
    return { text: result };
  },

  /* ---- the names you can give, and the giving of them ----------------- */
  nameable: function () {
    var out = [], i;
    for (i = 0; i < S.factory.floor.length; i++) {
      var h = S.factory.floor[i];
      if (!h.alive) continue;
      if (Town.alreadyNamed(h.name)) continue;
      out.push({ name: h.name, age: h.age, note: 'floor' });
    }
    if (S.flags.knowsAboutTheCut && !Town.alreadyNamed(TOWN_NPCS.vane.name)) {
      out.push({ name: TOWN_NPCS.vane.name, age: 41, note: 'cut' });
    }
    return out;
  },

  alreadyNamed: function (name) {
    var n = S.tracks.informant.names;
    for (var i = 0; i < n.length; i++) if (n[i].name === name) return true;
    return false;
  },

  giveName: function (name, note) {
    if (S.evening.ap < 1) return null;
    S.evening.ap -= 1;
    S.flags.namedToday = S.time.day;
    S.flags.informer = true;
    S.tracks.informant.known = true;
    S.tracks.informant.joined = true;
    var pay = note === 'cut' ? 36 : 18;
    S.tracks.informant.names.push({ name: name, day: S.time.day, note: note, fate: null, shown: false });
    S.tracks.informant.paid += pay;
    State.applyPurse({ pennies: pay });
    State.applyStanding({ workmates: -18, garrison: 10, foreman: 8, notice: -12 });
    State.applyMind({ resolve: -12 });
    UI.log(T('log.gained', { amt: Economy.money(pay) }), 'good');
    return txt('bounty') + ' ' + T('tracks.nameGiven', { name: name });
  },

  /* ---- Ostrek's counter: the pickers commit the action point ---------- */
  pawnList: function () {
    var out = [];
    for (var i = 0; i < S.house.goods.length; i++) {
      var g = GOODS[S.house.goods[i].id];
      if (g) out.push({ id: g.id, name: g.name, note: g.note, pawn: g.pawn, redeem: g.redeem });
    }
    return out;
  },

  pawnedList: function () {
    var out = [];
    for (var i = 0; i < S.house.pawned.length; i++) {
      var t = S.house.pawned[i];
      var g = GOODS[t.id];
      if (g) out.push({ id: g.id, name: g.name, redeem: t.redeem, day: t.day });
    }
    return out;
  },

  pawnItem: function (id, outright) {
    if (S.evening.ap < 1) return null;
    var g = GOODS[id];
    if (!g || !State.hasGood(id)) return null;
    State.takeGood(id);
    S.evening.ap -= 1;
    if (outright) {
      State.applyPurse({ pennies: g.pawn + 2 });
      S.flags.soldOutright = (S.flags.soldOutright || 0) + 1;
      State.applyMind({ resolve: -4 });
      UI.log(T('log.gained', { amt: Economy.money(g.pawn + 2) }), 'good');
      return txt('sellOutright');
    }
    State.applyPurse({ pennies: g.pawn });
    S.house.pawned.push({ id: id, day: S.time.day, redeem: g.redeem });
    S.flags.hasTicketOut = true;
    State.applyMind({ resolve: -2 });
    UI.log(T('log.gained', { amt: Economy.money(g.pawn) }), 'good');
    return txt('pawnGood');
  },

  redeemItem: function (id) {
    if (S.evening.ap < 1) return null;
    var idx = -1, i;
    for (i = 0; i < S.house.pawned.length; i++) if (S.house.pawned[i].id === id) idx = i;
    if (idx < 0) return null;
    var ticket = S.house.pawned[idx];
    if (!Economy.canAfford(ticket.redeem)) return null;
    Economy.spend(ticket.redeem);
    S.house.pawned.splice(idx, 1);
    State.giveGood(id);
    S.evening.ap -= 1;
    State.applyMind({ resolve: 5 });
    UI.log(T('log.spent', { amt: Economy.money(ticket.redeem) }));
    return txt('redeemGood');
  }
};

/* ---- js/minigames.js ---- */
/* ==========================================================================
   GRIMWICK WORKS — js/minigames.js   (Build 5)

   Four short bench games, one per floor. Each is a way of EXPRESSING the
   shift, not a new system underneath it: every game returns a quality from
   0 to 1, and the only thing quality does is move the day's output inside a
   ±10% band. Quality 0.5 is dead centre and is exactly what the sim did
   before this file existed — so skipping a game, or switching them off in
   Settings, reproduces Build 4 output to the piece.

   The canvas is only alive while a game is open; there is no persistent loop.
   Every game is playable on the keyboard alone and can be skipped at any
   moment.
   ========================================================================== */

var MINI_W = 640, MINI_H = 224;

var Minigames = {

  enabled: function () {
    return !!(S && S.settings && S.settings.minigames);
  },

  reduced: function () {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  },

  forStation: function (station) {
    return { CASTING: 'pour', CAP_BENCH: 'scoop', GRINDING: 'edge', STAMPING: 'press' }[station] || 'press';
  },

  /* ---------------------------------------------------------------- shell */
  play: function (station, onDone) {
    if (!Minigames.enabled()) { onDone(0.5); return; }
    var kind = Minigames.forStation(station);
    var game = Minigames.games[kind];
    var finished = false;
    var raf = null, scrim = null;

    function finish(quality, verdictKey) {
      if (finished) return;
      finished = true;
      if (raf) cancelAnimationFrame(raf);
      if (game.teardown) game.teardown();
      var q = Util.clamp(quality, 0, 1);
      Minigames.showVerdict(scrim, kind, q, verdictKey, function () {
        UI.closeModal(scrim);
        onDone(q);
      });
    }

    var m = el('div', 'modal modal--mini');
    var head = el('div', 'modal__head');
    head.appendChild(el('span', null, T('mini.' + kind + '.title')));
    m.appendChild(head);
    var body = el('div', 'modal__body');

    body.appendChild(el('p', 'mini__instruction', T('mini.' + kind + '.how')));

    var stage = el('div', 'mini');
    var canvas = document.createElement('canvas');
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = MINI_W * dpr;
    canvas.height = MINI_H * dpr;
    canvas.style.aspectRatio = MINI_W + ' / ' + MINI_H;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', T('mini.' + kind + '.how'));
    stage.appendChild(canvas);

    var hud = el('div', 'mini__hud');
    var label = el('span', 'mini__label', T('mini.' + kind + '.label'));
    var score = el('span', 'mini__score', '0');
    hud.appendChild(label);
    hud.appendChild(score);
    stage.appendChild(hud);
    body.appendChild(stage);

    var actions = el('div', 'actions');
    actions.appendChild(UI.button({
      id: 'btn-mini-skip', small: true,
      label: T('mini.skip'), hint: T('mini.skipHint'),
      onClick: function () { finish(0.5, 'skipped'); }
    }));
    body.appendChild(actions);
    m.appendChild(body);
    scrim = UI.openModal(m);

    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var api = {
      ctx: ctx, canvas: canvas, w: MINI_W, h: MINI_H,
      reduced: Minigames.reduced(),
      setScore: function (v) { score.textContent = v; },
      shake: function () {
        if (Minigames.reduced()) return;
        stage.classList.remove('shake');
        void stage.offsetWidth;
        stage.classList.add('shake');
      },
      finish: finish,
      /* the body brings its own difficulty to the bench */
      tremor: S.body.tremor / 100,
      fatigue: S.body.fatigue / 100,
      skill: Factory.skill(station) / 100,
      guardsOff: S.factory.guard === 'off',
      pace: S.factory.pace
    };

    game.setup(api);

    var t0 = performance.now();
    function frame(now) {
      if (finished) return;
      var t = (now - t0) / 1000;
      game.step(api, t);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  },

  showVerdict: function (scrim, kind, q, verdictKey, onDone) {
    var body = scrim.querySelector('.modal__body');
    clear(body);
    var cls = q >= 0.68 ? 'good' : (q >= 0.42 ? 'ok' : 'bad');
    var vKey = verdictKey === 'skipped' ? 'mini.skipped'
      : 'mini.' + kind + '.' + (cls === 'good' ? 'good' : (cls === 'ok' ? 'ok' : 'bad'));
    body.appendChild(el('div', 'mini__verdict mini__verdict--' + cls, T('mini.verdict.' + cls)));
    body.appendChild(el('p', 'prose', T(vKey)));
    var pct = Math.round((0.90 + q * 0.20) * 100);
    body.appendChild(UI.kv(T('mini.effect'), pct + '%' + ' ' + T('mini.effectOf')));
    body.appendChild(UI.actions([
      UI.button({ id: 'btn-mini-done', primary: true, label: T('mini.toTheBench'), onClick: onDone })
    ]));
    Audio.thunk();
  },

  /* ================================================================ games */
  games: {

    /* -------------------------------------------------------- THE POUR ---
       Lead into the mould. Hold to pour, release on the line. Overfill and
       it goes over the flags and takes the boot with it. */
    pour: {
      setup: function (api) {
        var g = api.g = {
          fill: 0, target: 0.78, pouring: false, mould: 0, moulds: 4,
          score: 0, results: [], spill: 0, sparks: [], done: false, last: 0
        };
        g.rate = 0.55 + api.pace === 'driven' ? 0.72 : 0.55;
        api.onKey = function (e) {
          if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            if (e.type === 'keydown') g.pouring = true; else g.pouring = false;
          }
        };
        api.onDown = function () { g.pouring = true; };
        api.onUp = function () { g.pouring = false; };
        document.addEventListener('keydown', api.onKey);
        document.addEventListener('keyup', api.onKey);
        api.canvas.addEventListener('mousedown', api.onDown);
        document.addEventListener('mouseup', api.onUp);
        api.canvas.addEventListener('touchstart', api.onDown, { passive: true });
        document.addEventListener('touchend', api.onUp);
        Minigames._t = api;
      },
      teardown: function () {
        var api = Minigames._t;
        if (!api) return;
        document.removeEventListener('keydown', api.onKey);
        document.removeEventListener('keyup', api.onKey);
        document.removeEventListener('mouseup', api.onUp);
        document.removeEventListener('touchend', api.onUp);
      },
      step: function (api, t) {
        var g = api.g, c = api.ctx, w = api.w, h = api.h;
        var dt = Math.min(0.05, t - g.last); g.last = t;

        if (g.pouring && !g.done) {
          g.fill += dt * (0.62 + api.pace === 'driven' ? 0.2 : 0);
          if (g.fill > 1.02) {
            g.results.push(0);
            g.spill = 0.6;
            api.shake();
            Audio.pour();
            g.fill = 0; g.mould++; g.pouring = false;
          }

  meets: function (req, location) {

    if (req.season && req.season !== S.time.season) return false;
    if (req.weather && req.weather !== S.time.weather) return false;
    if (req.location && req.location !== location) return false;
    if (typeof req.housed === 'boolean' && S.house.housed !== req.housed) return false;
    if (typeof req.employed === 'boolean' && S.job.employed !== req.employed) return false;
    if (typeof req.kin === 'boolean' && State.kinPresent() !== req.kin) return false;

    if (req.flags) {
      for (key in req.flags) {
        if (!Object.prototype.hasOwnProperty.call(req.flags, key)) continue;
        var want = req.flags[key];

        if (want === true && !have) return false;
        if (want !== true && have !== want) return false;

      for (var i = 0; i < req.notFlags.length; i++) if (S.flags[req.notFlags[i]]) return false;

/* ==========================================================================

   ========================================================================== */

   The game must never break because of it, so fall back to memory. */
var Store = (function () {
  var mem = {};
  var ok = false;
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem('grimwick.probe', '1');
      localStorage.removeItem('grimwick.probe');
      ok = true;
    }
  } catch (e) { ok = false; }
  return {
    available: ok,
    get: function (k) { try { return ok ? localStorage.getItem(k) : (mem[k] || null); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    del: function (k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }
  };

  write: function (slot) {

      season: S.time.season,
      act: S.time.act,

    return true;

  autosave: function () { return Save.write('auto'); },

    } catch (e) { return { slot: slot, corrupt: true }; }

  read: function (slot) {
    var raw = Store.get(Save.key(slot));

  migrate: function (state, fromVersion) {

    if (v < 2) {

    /* a null default (injury, docket, lastEventId) carries no shape to merge
       against, so whatever the record holds is the truth */
    if (template === null || template === undefined) return obj;
    if (obj === null) return Util.deepClone(template);
    if (Array.isArray(template)) return Array.isArray(obj) ? obj : Util.deepClone(template);

    if (typeof obj !== 'object') return Util.deepClone(template);

  var t = newState(1);
  S = keep;

      function noiseLayer(type, freq, q, gain) {
        var src = ctx.createBufferSource();
        src.buffer = Audio.noise();
        src.loop = true;
        var f = ctx.createBiquadFilter();
        f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
        var g = ctx.createGain(); g.gain.value = gain;
        src.connect(f); f.connect(g); g.connect(Audio.master);
        src.start();
        nodes.push(src, g);
        return g;
      }
      function every(ms, fn, skip) {
        var id = setInterval(function () {
          if (!Audio.enabled) return;
          if (skip && Math.random() < skip) return;
          fn();
        }, ms);
        Audio.ambient.timers.push(id);
      }

      if (bed === 'factory') {
        noiseLayer('lowpass', 190, 0, 0.20);
        every(1600, Audio.press);
        every(420, Audio.tick, 0.5);
      } else if (bed === 'street') {
        noiseLayer('lowpass', 320, 0, 0.10);
        /* rain, if it is raining */
        if (S.time.weather === 'rain' || S.time.weather === 'sleet') {
          noiseLayer('bandpass', 2600, 0.7, 0.10);
          noiseLayer('highpass', 5200, 0, 0.05);
        }
        every(5200, function () {
          Audio.tone({ type: 'triangle', freq: 300 + Math.random() * 120, dur: 0.09, gain: 0.02 });
        }, 0.4);
      } else if (bed === 'tavern') {
        noiseLayer('bandpass', 420, 0.5, 0.09);
        every(1700, function () {
          /* voices, none of them saying anything */
          Audio.tone({ type: 'sawtooth', freq: 100 + Math.random() * 90, dur: 0.3, gain: 0.022, filter: 'lowpass', cutoff: 620 });
        }, 0.2);
        every(6400, function () {
          Audio.tone({ type: 'triangle', freq: 720, dur: 0.14, gain: 0.03 });
        }, 0.35);
      } else if (bed === 'chapel') {
        noiseLayer('lowpass', 140, 0, 0.06);
        every(9000, function () {
          Audio.tone({ type: 'sine', freq: 196, dur: 2.2, gain: 0.035 });
        }, 0.3);
      } else if (bed === 'alley') {
        noiseLayer('lowpass', 240, 0, 0.08);
        every(4200, function () { Audio.burst({ filter: 'lowpass', cutoff: 500, gain: 0.03, dur: 0.4 }); }, 0.4);
      } else {
        /* a room: the fire if there is one, and the wall */
        noiseLayer('lowpass', 160, 0, 0.07);
        if (S.house.coal > 0) every(2600, function () {
          Audio.burst({ filter: 'bandpass', cutoff: 1400, q: 1.2, gain: 0.03, dur: 0.18 });
        }, 0.3);
      }
      Audio.ambient.nodes = nodes;
    } catch (e) { }
  },

  /* ----------------------------------------------------------- the cue ---
     One piece of music in the whole game, and it only plays when it is over.
     Nothing here is scored except grief. */
  endingCue: function () {
    if (!Audio.enabled || !(S.settings && S.settings.music)) return;
    var ctx = Audio.ensure();
    if (!ctx) return;
    Audio.stopAmbience();
    try {
      var t0 = ctx.currentTime + 0.15;
      /* a drone under it */
      var drone = ctx.createOscillator(), dg = ctx.createGain(), df = ctx.createBiquadFilter();
      drone.type = 'sine'; drone.frequency.value = 73.42;          /* D2 */
      df.type = 'lowpass'; df.frequency.value = 320;
      dg.gain.setValueAtTime(0.0001, t0);
      dg.gain.exponentialRampToValueAtTime(0.075, t0 + 2.2);
      dg.gain.exponentialRampToValueAtTime(0.0001, t0 + 15);
      drone.connect(df); df.connect(dg); dg.connect(Audio.master);
      drone.start(t0); drone.stop(t0 + 15.4);
      Audio.ambient.nodes.push(drone, dg);

      /* D minor, falling, unhurried, unresolved */
      var phrase = [
        [293.66, 0.0, 1.5], [349.23, 1.4, 1.4], [440.00, 2.7, 2.1],
        [392.00, 4.6, 1.5], [349.23, 5.9, 2.4], [293.66, 8.1, 2.0],
        [261.63, 10.0, 2.6], [220.00, 12.2, 3.0]
      ];
      for (var i = 0; i < phrase.length; i++) {
        var f = phrase[i][0], at = t0 + phrase[i][1], dur = phrase[i][2];
        var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'triangle';
        o.frequency.value = f;
        lp.type = 'lowpass'; lp.frequency.value = 1100;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.062, at + 0.28);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(lp); lp.connect(g); g.connect(Audio.master);
        o.start(at); o.stop(at + dur + 0.1);
        Audio.ambient.nodes.push(o, g);
      }
    } catch (e) { }
  },

  /* ---------------------------------------------------------- shift hooks */
  shiftStart: function (station) {
    if (!Audio.enabled) return;
    Audio.bell();
    Audio.ambience(station);
  },
  shiftEnd: function () {
    if (!Audio.enabled) return;
    Audio.stopAmbience();
    Audio.bell();
  },
  beat: function (kind) {
    if (!Audio.enabled) return;
    if (kind === 'cat') Audio.flash();
    else if (kind === 'hurt') Audio.hit();
    else if (kind === 'bad') Audio.thunk();
    else Audio.tick();
  },

  /* kept for the older call sites */
  chime: function () { Audio.coin(); }

    document.body.insertBefore(host, document.body.firstChild);

  applyAtmosphere: function () {

    r.classList.toggle('atmo-rain',     on && a.rain !== false);

  /* ---------------------------------------------------------------- button
     The single contract: an action, or a disabled control that says why.
     ------------------------------------------------------------------ */
  button: function (opts) {
    var b = el('button', 'btn' + (opts.primary ? ' btn--primary' : '') + (opts.small ? ' btn--small' : ''));
    if (opts.id) b.id = opts.id;
    b.type = 'button';

    /* a price inside a label keeps the typewriter: money is always monospace */
    var label = el('span', 'btn__label');
    var split = String(opts.label).split(' \u2014 ');
    if (split.length === 2 && /^(\u2212)?(\d+c )?(\d+s )?\d+d$/.test(split[1])) {
      label.appendChild(document.createTextNode(split[0] + ' \u2014 '));
      label.appendChild(el('span', 'btn__price', split[1]));
    } else {
      label.textContent = opts.label;
    }
    b.appendChild(label);

    var reason = opts.reason || null;
    var hint = reason || opts.hint;
    if (hint) b.appendChild(el('span', 'btn__hint', hint));

    if (reason) {
      b.disabled = true;
      b.setAttribute('aria-disabled', 'true');
      b.title = reason;
    } else {
      b.title = opts.hint || opts.label;
      /* proof, at runtime, that this control does something */
      b.dataset.acts = '1';
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        Audio.unlock();          /* browsers keep the sound locked until a click */
        opts.onClick();

    return b;

  /* The node map. Roads are drawn; the labels are buttons over the top so
     they stay legible at any width, and collapse to a list on a phone. */
  mapNode: function () {
    var box = el('div', 'map');
    var inner = el('div', 'map__inner');
    var here = Town.here();
    var meta = { visible: {}, reach: {}, far: {} };
    var locs = Town.locations(), i;

    for (i = 0; i < locs.length; i++) {
      var l = locs[i];
      meta.visible[l.id] = Town.visible(l);
      meta.far[l.id] = l.district;
      meta.reach[l.id] = Town.canTravel(l.id) === true;
    }
    var svgHost = el('div', 'map__svg');
    Art.into(svgHost, Art.townMap(meta, here));
    box.appendChild(svgHost);

    for (i = 0; i < locs.length; i++) {
      (function (loc) {
        if (!Town.visible(loc)) return;
        var isHere = loc.id === here;
        var can = Town.canTravel(loc.id);
        var cost = Town.travelCost(loc.id);
        var b = UI.button({
          label: loc.name,
          hint: '',
          reason: (isHere || can === true) ? null : T(can),
          onClick: function () { Loop.travel(loc.id); }
        });
        b.className = 'map__node' + (isHere ? ' map__node--here' : '');
        clear(b);
        b.appendChild(el('span', null, loc.short || loc.name));
        b.appendChild(el('span', 'map__cost', isHere ? T('town.hereNow')
          : (cost === 0 ? T('town.nearby') : T('town.hoursWalk', { n: cost }))));
        if (isHere) { b.disabled = true; b.title = T('town.hereNow'); }
        var pos = Art.mapPositions[loc.id];
        if (pos) {
          b.style.left = (pos.x / 1000 * 100) + '%';
          b.style.top = (pos.y / 340 * 100) + '%';
        }
        inner.appendChild(b);
      })(locs[i]);
    }
    box.appendChild(inner);
    return box;
  },

  showBoard: function () {
    var scrim;

      body.appendChild(el('p', 'prose prose--dim', T('board.war.' + Empire.newsBand())));
      var t = document.createElement('table');
      t.className = 'board';
      var head = document.createElement('tr');
      [T('board.item'), T('board.lastWeek'), T('board.thisWeek'), T('board.change'), T('board.store')]
        .forEach(function (h) {
          var th = document.createElement('th');
          th.textContent = h;
          head.appendChild(th);
        });
      t.appendChild(head);
      var rows = Economy.board();
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var tr = document.createElement('tr');
        function cell(text, cls) {
          var td = document.createElement('td');
          td.textContent = text;
          if (cls) td.className = cls;
          tr.appendChild(td);
        }
        cell(T('board.items.' + r.id));
        cell(Economy.money(r.was));
        cell(Economy.money(r.now));
        cell((r.delta > 0 ? '+' : '') + (r.delta === 0 ? T('board.same') : Economy.money(r.delta)),
          r.delta > 0 ? 'up' : (r.delta < 0 ? 'down' : 'flat'));
        cell(Economy.money(r.store), 'board__store');
        t.appendChild(tr);
      }
      body.appendChild(t);
      body.appendChild(el('p', 'prose prose--dim', T('board.storeNote')));

        UI.button({ label: T('app.close'), primary: true, onClick: function () { UI.closeModal(scrim); } })

        (function (it) {

          if (S.evening.ap < 1) reason = T('disabled.noAp');

          list.appendChild(UI.button({

            reason: reason,
            onClick: function () {
              var res = mode === 'redeem' ? Town.redeemItem(it.id) : Town.pawnItem(it.id, mode === 'sell');

              if (res) UI.showResult(res, function () { UI.render(); });

  /* ---------------------------------------------------------------- modals */
  openModal: function (node, opts) {
    opts = opts || {};
    var scrim = el('div', 'scrim fade-in');
    scrim.appendChild(node);
    scrim.dataset.dismissible = opts.dismissible ? '1' : '0';
    document.body.appendChild(scrim);
    UI.modalStack.push(scrim);

  /* --------------------------------------------------------- settings ---
     Every decorative layer, switchable on its own, plus one switch that

  showSettings: function () {
    var scrim;
    var m = UI.modal(T('settings.heading'), function (body) {
      body.appendChild(el('p', 'prose prose--dim', T('settings.blurb')));

      function toggleRow(container, name, note, get, set) {
        var row = el('div', 'settings__row');
        var left = el('div');
        left.appendChild(el('div', 'settings__name', name));
        if (note) left.appendChild(el('div', 'settings__note', note));
        row.appendChild(left);
        var btn = el('button', 'toggle');
        btn.type = 'button';
        function paint() {
          var v = !!get();
          btn.textContent = T(v ? 'settings.on' : 'settings.off');
          btn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
        btn.dataset.acts = '1';
        btn.addEventListener('click', function () {
          set(!get());
          paint();
          UI.applyAtmosphere();
          Audio.dial();
          UI.render();
        });
        paint();
        row.appendChild(btn);
        container.appendChild(row);
        return btn;
      }

      /* the master switch */
      var master = el('div', 'settings__master');
      toggleRow(master, T('settings.plainLedger'), T('settings.plainLedgerNote'),
        function () { return S.settings.plainLedger; },
        function (v) { S.settings.plainLedger = v; });
      body.appendChild(master);

      body.appendChild(el('div', 'eyebrow', T('settings.atmoHeading')));
      var atmo = el('div');
      var layers = [
        ['grain', 'settings.grain', 'settings.grainNote'],
        ['gaslight', 'settings.gaslightL', 'settings.gaslightNote'],
        ['smoke', 'settings.smoke', 'settings.smokeNote'],
        ['rain', 'settings.rain', 'settings.rainNote'],
        ['season', 'settings.season', 'settings.seasonNote'],
        ['vignette', 'settings.vignette', 'settings.vignetteNote']
      ];
      for (var i = 0; i < layers.length; i++) {
        (function (key, nameKey, noteKey) {
          var b = toggleRow(atmo, T(nameKey), T(noteKey),
            function () { return S.settings.atmo[key]; },
            function (v) { S.settings.atmo[key] = v; });
          b.dataset.layer = key;
        })(layers[i][0], layers[i][1], layers[i][2]);
      }
      body.appendChild(atmo);

      body.appendChild(el('div', 'eyebrow', T('settings.soundHeading')));
      var snd = el('div');
      toggleRow(snd, T('settings.sound'), T('settings.soundNote'),

        function () { return S.settings.minigames; },

      body.appendChild(play);

      body.appendChild(UI.actions([
        UI.button({
          id: 'btn-settings-close', primary: true, label: T('settings.close'),
