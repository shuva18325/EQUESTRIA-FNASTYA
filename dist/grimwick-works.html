<style>
/* ---- css/reset.css ---- */
/* GRIMWICK WORKS — reset.css */
*, *::before, *::after { box-sizing: border-box; }
html, body, div, section, header, footer, main, aside, h1, h2, h3, h4, p, ul, ol, li,
figure, blockquote, dl, dd, table, th, td { margin: 0; padding: 0; }
ul, ol { list-style: none; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100%; line-height: 1.5; }
img, svg { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
button[disabled] { cursor: not-allowed; }
table { border-collapse: collapse; width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- css/tokens.css ---- */
/* ==========================================================================
   GRIMWICK WORKS — tokens.css   (Build 5)

   Printed in 1851, left in a wet cellar. Grim is the palette; it is never an
   excuse for text you cannot read.

   THE FLOOR, held by every value below:
     body text >= 15px,  every text/ground pair >= 4.5:1.

   The three accent tokens in the brief — brick, rust, verdigris — are
   STRUCTURAL colours. Measured as text they run 2.0–3.1:1, so each has a
   text-safe sibling derived from it (…-text). Structure uses the brief's
   value; type uses the sibling. Contrast for every pair is listed beside it,
   measured against the four grounds in this file.
   ========================================================================== */
:root {
  /* ---- the brief's palette, used for what the brief uses it for ---- */
  --soot:       #14161A;   /* background base */
  --slate:      #22272D;   /* panels */
  --brick:      #6B3A2E;   /* structure, borders, rules */
  --gaslight:   #E0A24A;   /* the only warm light. rationed. 8.1:1 on soot */
  --ash:        #C9C4B8;   /* body text. 10.4:1 on soot */
  --rust:       #8E3B2F;   /* danger, blood, fines — as fill and border */
  --verdigris:  #4E6B5E;   /* the union thread — as fill and border */

  /* ---- grounds ---- */
  --soot-deep:  #0E1013;
  --slate-2:    #2A3037;
  --slate-3:    #333A42;   /* the lightest ground any text sits on (hover) */

  /* ---- type colours, each cleared on all four grounds ---- */
  --ash-dim:        #BCB7A9;   /*  8.9 / 7.4 / 6.6 / 5.7 */
  --ash-faint:      #B0AB9E;   /*  7.9 / 6.6 / 5.8 / 5.0 */
  --rust-text:      #EA9084;   /*  7.6 / 6.3 / 5.6 / 4.8 */
  --verdigris-text: #9CC0AB;   /*  9.1 / 7.6 / 6.7 / 5.8 */
  --gaslight-text:  #E0A24A;   /*  8.1 / 6.8 / 6.0 / 5.2 */

  /* ---- structural lines and dull fills (never carry text) ---- */
  --line:       #3A424B;
  --line-soft:  #2C333A;
  --amber-fill: #A87A32;
  --bile:       #8C9660;   /* the permanent stats: dust, tremor, lead */

  /* ---- the docket ---- */
  --paper:       #E4DED0;
  --paper-2:     #D8D1C0;
  --paper-ink:   #191712;   /* 13.4:1 on paper */
  --paper-dim:   #4A4438;   /*  7.2:1 */
  --paper-rule:  #A79E88;   /* rules only */
  --paper-stamp: #7A2C24;   /*  7.1:1 */
  --paper-bleed: #5C1F18;   /*  9.4:1 — where the deductions bleed */

  /* ---- type ------------------------------------------------------------
     Three faces and no more. The contrast between condensed wood type and
     typewriter figures is the identity; nothing else needs to be added. */
  --font-display: 'Big Shoulders Display', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
  --font-body:    'Bitter', Georgia, 'Times New Roman', serif;
  --font-mono:    'Courier Prime', 'Courier New', ui-monospace, monospace;

  --fs-base: 16px;
  --fs-sm:   15px;   /* the floor. nothing smaller ships. */
  --fs-md:   16px;
  --fs-lg:   20px;
  --fs-xl:   26px;
  --fs-xxl:  36px;
  --lh-body: 1.6;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --shadow: 0 2px 0 rgba(0,0,0,.55), 0 10px 28px rgba(0,0,0,.5);

  /* ---- legacy aliases -------------------------------------------------
     Build 1–4 rules refer to these names. Each is mapped to whatever keeps
     that rule correct under the new palette, so the whole game re-skins from
     this file without a single rule being rewritten by hand. */
  --bg:          var(--soot);
  --bg-deep:     var(--soot-deep);
  --panel:       var(--slate);
  --panel-2:     var(--slate-2);
  --panel-3:     var(--slate-3);
  --text:        var(--ash);
  --text-dim:    var(--ash-dim);
  --text-faint:  var(--ash-faint);
  --rust-deep:   var(--brick);
  --blood:       var(--rust-text);
  --blood-deep:  var(--rust);
  --brass:       var(--gaslight);
  --good:        var(--verdigris-text);
  --sick:        var(--bile);
  --focus:       var(--gaslight);
  --paper-line:  var(--paper-rule);
  --font-ui:     var(--font-display);
}

/* ---- SEASON WASH -------------------------------------------------------
   The season moves the ground, never the ink: winter darkens the grounds by
   a fifth, which raises text contrast rather than lowering it. */
html.atmo-season .season-LATE-SUMMER { --soot: #17181A; --slate: #24272B; --slate-2: #2C3036; }
html.atmo-season .season-AUTUMN      { --soot: #17150F; --slate: #262218; --slate-2: #2E2A1F; }
html.atmo-season .season-WINTER      { --soot: #0F1216; --slate: #1C2229; --slate-2: #242B33; }
html.atmo-season .season-THAW        { --soot: #131714; --slate: #1F2621; --slate-2: #272F29; }

/* ---- css/layout.css ---- */
/* GRIMWICK WORKS — layout.css : the frame, nothing decorative. */

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  overflow-x: hidden;
}

#app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 1200px;
  margin: 0 auto;
}

/* ---- header ---- */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  background: var(--bg-deep);
}
.topbar__title {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gaslight);
  white-space: nowrap;
  line-height: 1;
}
.topbar__meta {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  letter-spacing: .06em;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  min-width: 0;
}
.topbar__spacer { flex: 1 1 auto; }
.topbar__tools { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

/* ---- body ---- */
.stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: var(--sp-4);
  padding: var(--sp-4);
  align-items: start;
}
.column { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); }

/* ---- log ---- */
.logbar {
  border-top: 1px solid var(--line);
  background: var(--bg-deep);
  padding: var(--sp-3) var(--sp-4);
  max-height: 26vh;
  overflow-y: auto;
}

@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .column--aside { order: -1; }
}
@media (max-width: 420px) {
  .stage { padding: var(--sp-3); gap: var(--sp-3); }
  .topbar { padding: var(--sp-3); }
  .topbar__title { font-size: var(--fs-sm); }
}

/* ---- css/components.css ---- */
/* GRIMWICK WORKS — components.css : panels, buttons, the docket. */

/* ---------- panels ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 2px;
}
.panel__head {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .18em;
  font-weight: 700;
  color: var(--text-dim);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg-deep);
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}
.panel__body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.panel--flag { border-left: 3px solid var(--rust-deep); }

.prose { font-size: var(--fs-md); line-height: 1.6; color: var(--text); }
.prose--dim { color: var(--text-dim); }
.prose + .prose { margin-top: var(--sp-2); }
.heading {
  font-family: var(--font-ui);
  font-size: var(--fs-lg);
  letter-spacing: .1em;
  font-weight: 700;
  color: var(--text);
}
.eyebrow {
  font-family: var(--font-display);
  font-size: var(--fs-sm);
  letter-spacing: .18em;
  color: var(--ash);
  font-weight: 700;
  text-transform: uppercase;
}

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .06em;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 11px 14px;
  text-align: left;
  min-height: 44px;
  transition: background .12s linear, border-color .12s linear;
}
.btn:hover:not([disabled]) { background: var(--panel-3); border-color: var(--rust-deep); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] {
  color: var(--text-faint);
  background: #1a1815;
  border-color: var(--line-soft);
  border-style: dashed;
}
.btn--primary {
  background: #7c4020;          /* 7.3:1 against its label */
  border-color: var(--gaslight);
  color: #fff2e6;
  font-weight: 700;
}
.btn--primary:hover:not([disabled]) { background: #8a4a26; }  /* still 6.2:1 */
.btn--ghost { background: transparent; }
.btn--small { min-height: 38px; padding: 8px 11px; }
.btn__label { display: block; }
.btn__hint {
  display: block;
  font-size: var(--fs-sm);
  color: var(--text-faint);
  font-family: var(--font-body);
  letter-spacing: 0;
  margin-top: 3px;
  line-height: 1.35;
}
.btn[disabled] .btn__hint { color: var(--text-faint); }
.btn--primary .btn__hint { color: #ffe8d6; }  /* 5.8:1 at rest, 4.96:1 on hover */
.actions { display: flex; flex-direction: column; gap: var(--sp-2); }
.actions--row { flex-direction: row; flex-wrap: wrap; }
.actions--row .btn { flex: 1 1 200px; }

/* ---------- stat readouts ---------- */
.stats { display: grid; grid-template-columns: 1fr; gap: 7px; }
.stat { display: grid; grid-template-columns: 92px 1fr auto; gap: var(--sp-2); align-items: center; }
.stat__name {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  letter-spacing: .04em;
}
.stat__bar {
  height: 9px;
  background: #0d0c0b;
  border: 1px solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.stat__fill { position: absolute; inset: 0 auto 0 0; background: var(--brick); }
.stat__fill--good { background: #6E7F70; }
.stat__fill--warn { background: var(--amber-fill); }
.stat__fill--bad  { background: var(--blood); }
.stat__fill--perm { background: var(--sick); }
.stat__val {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  min-width: 116px;
  text-align: right;
}
.stat--perm .stat__name::after {
  content: '†';
  color: var(--sick);
  margin-left: 4px;
}

.kv {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-sm);
  flex-wrap: wrap;
}
.kv__k { color: var(--text-dim); font-family: var(--font-ui); letter-spacing: .04em; min-width: 0; }
.kv--stack { display: block; }
.kv--stack .kv__v { display: block; text-align: left; margin-top: 3px; }
.kv__v {
  font-family: var(--font-mono);
  color: var(--text);
  text-align: right;
  min-width: 0;
  overflow-wrap: anywhere;
}
.kv__v--bad { color: var(--blood); }
.kv__v--good { color: var(--good); }

/* ---------- objectives ---------- */
.objective { border-left: 3px solid var(--brick); padding-left: var(--sp-3); }
.objective__label {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .14em;
  color: var(--text-faint);
  display: block;
  margin-bottom: 2px;
}
.objective__text { font-size: var(--fs-md); color: var(--text); line-height: 1.45; }
.deadline { border-left-color: var(--brass); }

/* ---------- log ---------- */
.logline {
  font-size: var(--fs-sm);
  color: var(--text-dim);
  font-family: var(--font-body);
  padding: 2px 0;
  border-bottom: 1px dotted var(--line-soft);
}
.logline--head { color: var(--ash-dim); font-family: var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
.logline--bad { color: var(--blood); }
.logline--good { color: var(--good); }

/* ---------- modal ---------- */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(6,5,4,.86);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  z-index: 60;
  overflow-y: auto;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  max-width: 620px;
  width: 100%;
  box-shadow: var(--shadow);
  margin: auto;
}
.modal__head {
  padding: var(--sp-4);
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg-deep);
  font-family: var(--font-ui);
  letter-spacing: .16em;
  font-weight: 700;
  color: var(--ash);
  font-size: var(--fs-lg);
  text-transform: uppercase;
}
.modal__body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }

/* ---------- THE DOCKET ---------- */
.docket-wrap { display: flex; justify-content: center; width: 100%; }
.docket {
  width: 100%;
  max-width: 430px;
  background: var(--paper);
  color: var(--paper-ink);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.55;
  padding: 26px 22px 20px;
  position: relative;
  box-shadow: 0 18px 40px rgba(0,0,0,.6);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.028) 0 1px, transparent 1px 3px),
    radial-gradient(120% 60% at 50% 0%, rgba(140,74,36,.10), transparent 70%);
}
.docket::before, .docket::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 7px;
  background:
    repeating-linear-gradient(135deg, var(--paper) 0 5px, transparent 5px 10px),
    repeating-linear-gradient(45deg, var(--paper) 0 5px, transparent 5px 10px);
}
.docket::before { top: -6px; }
.docket::after { bottom: -6px; }
.docket__works {
  text-align: center;
  font-weight: 700;
  letter-spacing: .12em;
  border-bottom: 2px solid var(--paper-ink);
  padding-bottom: 4px;
}
.docket__dept {
  text-align: center;
  color: var(--paper-dim);
  letter-spacing: .1em;
  margin-bottom: var(--sp-3);
}
.docket__title {
  text-align: center;
  letter-spacing: .34em;
  font-weight: 700;
  margin-bottom: var(--sp-3);
}
.docket__row { display: flex; justify-content: space-between; gap: var(--sp-3); }
.docket__row--meta { color: var(--paper-dim); }
.docket__rule { border-top: 1px dashed var(--paper-line); margin: var(--sp-3) 0; }
.docket__section {
  letter-spacing: .2em;
  font-weight: 700;
  margin: var(--sp-2) 0 var(--sp-1);
}
.docket__item { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px; }
.docket__item .lead {
  border-bottom: 1px dotted var(--paper-line);
  overflow: hidden;
  overflow-wrap: anywhere;
}
.docket__item .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.docket__net {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-weight: 700;
  font-size: var(--fs-md);
  border-top: 2px solid var(--paper-ink);
  border-bottom: 2px solid var(--paper-ink);
  padding: 6px 0;
  margin-top: var(--sp-2);
}
.docket__net--red { color: #7a1d16; }
.docket__note {
  margin-top: var(--sp-4);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  font-style: italic;
  color: var(--paper-ink);
  border-top: 1px solid var(--paper-line);
  padding-top: var(--sp-3);
  line-height: 1.5;
}
.docket__clerk {
  margin-top: var(--sp-3);
  color: var(--paper-dim);
  font-size: var(--fs-sm);
  text-align: center;
  line-height: 1.4;
}
/* the clerk stamps the foot of the slip. it never sits over the figures,
   because a figure you cannot read is a figure you cannot argue with. */
.docket__stamp {
  display: block;
  width: -moz-max-content;
  width: max-content;
  margin: var(--sp-3) 6px 0 auto;
  border: 3px double var(--paper-stamp);
  color: var(--paper-stamp);
  font-weight: 700;
  letter-spacing: .22em;
  padding: 4px 8px;
  transform: rotate(-5deg);
  opacity: .8;
  font-size: var(--fs-sm);
}

/* ---------- tutorial ---------- */
.tut {
  position: fixed;
  z-index: 80;
  max-width: 360px;
  background: var(--panel-2);
  border: 1px solid var(--gaslight);
  box-shadow: var(--shadow);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.tut__title {
  font-family: var(--font-ui);
  letter-spacing: .16em;
  font-weight: 700;
  color: var(--gaslight);
  font-size: var(--fs-sm);
}
.tut__text { font-size: var(--fs-md); line-height: 1.5; }
.tut__foot { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
.tut__count { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-dim); }
.tut-target { outline: 2px solid var(--gaslight); outline-offset: 3px; }

/* ---------- debug ---------- */
.debug {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(460px, 100%);
  background: #0e0d0c;
  border-left: 1px solid var(--rust-deep);
  z-index: 90;
  display: flex;
  flex-direction: column;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
}
.debug__head {
  padding: var(--sp-3);
  border-bottom: 1px solid var(--line);
  color: var(--ash);
  letter-spacing: .12em;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  gap: var(--sp-2);
}
.debug__body { overflow-y: auto; padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
.debug__row { display: grid; grid-template-columns: 1fr 130px; gap: var(--sp-2); align-items: center; }
.debug__row label { color: var(--text-dim); font-size: var(--fs-sm); word-break: break-all; }
.debug input, .debug select {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 7px;
  font-size: var(--fs-sm);
  width: 100%;
  font-family: var(--font-mono);
}
.debug__group {
  color: var(--ash-dim);
  letter-spacing: .14em;
  font-weight: 700;
  margin-top: var(--sp-3);
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 3px;
}

/* ---------- misc ---------- */
.tag {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .1em;
  border: 1px solid var(--line);
  padding: 2px 7px;
  color: var(--text-dim);
}
.tag--phase { color: var(--ash); border-color: var(--brick); }
.divider { border-top: 1px solid var(--line-soft); }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   THE SHIFT — Build 2
   ========================================================================== */

/* ---- the works, over the top of the floor ---- */
.works-banner {
  position: relative;
  border: 1px solid var(--line);
  overflow: hidden;
  background: #100d0a;
  line-height: 0;
}
.works-banner .gw-svg { width: 100%; height: 168px; display: block; }
.works-banner__plate {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  background: linear-gradient(180deg, rgba(10,8,6,0), rgba(10,8,6,.92) 60%);
  line-height: 1.4;
}
.works-banner__name {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .18em;
  font-weight: 700;
  color: var(--brass);
}
.works-banner__dept {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .1em;
  color: var(--text-dim);
}

/* ---- station illustration ---- */
.station-art {
  border: 1px solid var(--line-soft);
  background: #171310;
  line-height: 0;
  overflow: hidden;
}
.station-art .gw-svg { width: 100%; height: auto; max-height: 240px; display: block; }

.hazard-line { display: flex; gap: var(--sp-2); align-items: baseline; }
.hazard-line__label { color: var(--blood); }

/* ---- the dials ---- */
.dial { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
.dial + .dial { margin-top: var(--sp-3); }
.dial__name {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .14em;
  color: var(--text-dim);
  padding-top: 12px;
}
.dial__seg { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.dial__opt { flex: 1 1 150px; }
.dial__opt--on {
  border-color: var(--gaslight);
  background: var(--panel-3);
  box-shadow: inset 3px 0 0 var(--gaslight);
}
.dial__opt--on .btn__label { color: var(--focus); font-weight: 700; }
.dial__opt--off.dial__opt--on { box-shadow: inset 3px 0 0 var(--blood); border-color: var(--blood-deep); }

.forecast {
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  margin-top: var(--sp-4);
  padding: var(--sp-3);
  border: 1px dashed var(--line);
  background: #171412;
}
.forecast__icon { line-height: 0; flex: 0 0 auto; }
.forecast__text { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text); }
.forecast__sub { color: var(--text-dim); }

/* ---- the count ---- */
.quota-bar {
  height: 14px;
  background: #0d0b09;
  border: 1px solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.quota-bar__fill { position: absolute; inset: 0 auto 0 0; background: var(--rust-deep); }
.quota-bar__fill--met { background: #4a6b46; }
.ratchet {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--brass);
  border-top: 1px dotted var(--line);
  padding-top: var(--sp-2);
}
.ratchet-big {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
  padding: var(--sp-4) 0;
}
.ratchet-big__box {
  border: 1px solid var(--line);
  padding: var(--sp-3) var(--sp-4);
  text-align: center;
  min-width: 120px;
}
.ratchet-big__box--new { border-color: var(--gaslight); background: #2A1F1B; }
.ratchet-big__label {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .12em;
  color: var(--text-dim);
}
.ratchet-big__num { font-family: var(--font-mono); font-size: var(--fs-xl); color: var(--text); }
.ratchet-big__box--new .ratchet-big__num { color: var(--focus); }
.ratchet-big__arrow { font-size: var(--fs-xl); color: var(--rust-text); }

/* ---- the resolution column ---- */
.modal--shift { max-width: 660px; }
.beats {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  max-height: 44vh;
  overflow-y: auto;
  padding-right: var(--sp-2);
}
.beat {
  font-size: var(--fs-md);
  line-height: 1.45;
  color: var(--text-dim);
  border-left: 2px solid var(--line);
  padding: 2px 0 2px var(--sp-3);
  animation: beatIn .22s ease-out;
}
.beat--bad { color: var(--text); border-left-color: var(--brick); }
.beat--good { color: var(--good); border-left-color: var(--good); }
.beat--hurt, .beat--cat {
  color: var(--blood);
  border-left-color: var(--blood);
  font-size: var(--fs-lg);
  letter-spacing: .06em;
}
@keyframes beatIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.catastrophe {
  border: 1px solid var(--blood-deep);
  border-left-width: 4px;
  background: #1e1310;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.catastrophe__title {
  font-family: var(--font-ui);
  font-size: var(--fs-lg);
  letter-spacing: .2em;
  font-weight: 700;
  color: var(--blood);
}
.injury-note {
  border: 1px solid var(--blood-deep);
  background: #1c1512;
  padding: var(--sp-3) var(--sp-4);
}
.injury-note__title {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .2em;
  font-weight: 700;
  color: var(--blood);
  margin-bottom: var(--sp-2);
}

/* ---- tally ---- */
.tally-head { display: flex; align-items: center; gap: var(--sp-4); }
.tally-head__icon { line-height: 0; }
.tally-head__big { font-family: var(--font-mono); font-size: var(--fs-xl); color: var(--text); }
.tally-head__sub {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .16em;
  color: var(--text-dim);
}
.tally-mini {
  display: flex;
  gap: var(--sp-4);
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: var(--sp-3);
  margin-top: var(--sp-3);
}
.tally-mini__rows { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.transfer-cost { border-left: 3px solid var(--brick); padding-left: var(--sp-3); }

/* ---- icons ---- */
.gw-icon { height: 34px; width: auto; display: block; }
.gw-icon--musket { height: 26px; }

@media (max-width: 620px) {
  .dial { grid-template-columns: minmax(0, 1fr); }
  .dial__name { padding-top: 0; }
  .works-banner .gw-svg { height: 120px; }
  .ratchet-big__arrow { transform: rotate(90deg); }
}

/* ==========================================================================
   GRIMWICK — the town, Build 3
   ========================================================================== */
.map {
  position: relative;
  border: 1px solid var(--brick);
  background: #E8E2D2;
  overflow: hidden;
}
.map .gw-map { width: 100%; height: 360px; display: block; }
.map__node {
  position: absolute;
  max-width: 21%;
  white-space: normal;
  transform: translate(-50%, -50%);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .04em;
  color: var(--text);
  background: rgba(18, 15, 12, .92);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 5px 9px;
  min-height: 0;
  text-align: center;
  line-height: 1.25;
}
.map__node:hover:not([disabled]) { border-color: var(--brick); background: var(--panel-3); }
.map__node[disabled] { color: var(--text-faint); border-style: dashed; background: rgba(18,15,12,.8); }
.map__node--here { border-color: var(--gaslight); color: var(--focus); box-shadow: 0 0 0 2px rgba(216,131,75,.25); }
.map__cost {
  display: block;
  font-family: var(--font-mono);
  color: var(--text-faint);
  font-size: var(--fs-sm);
}
.map__node--here .map__cost { color: var(--gaslight); }

.node-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--sp-2); }
@media (max-width: 760px) {
  .map .gw-map { display: none; }
  .map__node { position: static; transform: none; display: block; width: 100%; white-space: normal; }
  .map { border: 0; }
  .map__inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--sp-2); }
}

.where {
  display: flex;
  gap: var(--sp-3);
  align-items: baseline;
  flex-wrap: wrap;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .1em;
  color: var(--text-dim);
}
.where__name { color: var(--gaslight); font-weight: 700; }

.board { width: 100%; font-family: var(--font-mono); font-size: var(--fs-sm); }
.board th {
  text-align: right;
  color: var(--text-dim);
  font-family: var(--font-ui);
  letter-spacing: .1em;
  font-weight: 700;
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
}
.board th:first-child, .board td:first-child { text-align: left; }
.board td { text-align: right; padding: 5px 6px; border-bottom: 1px dotted var(--line-soft); color: var(--text); }
.board .up { color: var(--blood); }
.board .down { color: var(--good); }
.board .flat { color: var(--text-faint); }
.board__store { color: var(--brass); }

.creation { display: grid; gap: var(--sp-3); }
.creation__opt {
  border: 1px solid var(--line);
  background: var(--panel-2);
  padding: var(--sp-4);
  text-align: left;
  display: block;
  width: 100%;
}
.creation__opt:hover { border-color: var(--brick); background: var(--panel-3); }
.creation__who { font-family: var(--font-ui); font-size: var(--fs-md); font-weight: 700; color: var(--focus); letter-spacing: .06em; }
.creation__blurb { font-size: var(--fs-md); color: var(--text); margin-top: var(--sp-2); line-height: 1.5; }
.creation__cost { font-size: var(--fs-sm); color: var(--ash-dim); margin-top: var(--sp-2); font-family: var(--font-mono); }

.destitute-note {
  border-left: 3px solid var(--blood);
  background: #1c1512;
  padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-md);
}
.goods-row { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); }
.goods-row__note { color: var(--text-faint); font-size: var(--fs-sm); }

/* ==========================================================================
   PRESSURE AND CONSEQUENCE — Build 4
   ========================================================================== */
.order-head { display: flex; gap: var(--sp-3); align-items: center; }
.order-head__icon { line-height: 0; flex: 0 0 auto; }
.order-head__name { font-family: var(--font-ui); font-size: var(--fs-md); font-weight: 700; color: var(--text); }
.order-head__class { font-family: var(--font-ui); font-size: var(--fs-sm); letter-spacing: .18em; }

.rarity {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .18em;
  font-weight: 700;
}
.rarity--COMMON    { color: var(--text-dim); }
.rarity--UNCOMMON  { color: #9fbf8c; }
.rarity--FINE      { color: #79b6c9; }
.rarity--RARE      { color: var(--brass); }
.rarity--PROTOTYPE { color: var(--blood); }
#order-panel .panel__head .rarity--PROTOTYPE { animation: proto 2.4s ease-in-out infinite; }
@keyframes proto { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

.world-line { border-left-color: var(--sick); }

.broadsheet__item {
  border-bottom: 1px dotted var(--line);
  padding-bottom: var(--sp-2);
  font-family: var(--font-body);
}

.account-block { margin-top: var(--sp-3); }
.account-block__label {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  letter-spacing: .18em;
  color: var(--text-faint);
  margin-bottom: 3px;
}
.account-block__line {
  font-size: var(--fs-sm);
  color: var(--text-dim);
  padding: 2px 0 2px var(--sp-3);
  border-left: 2px solid var(--line);
}
.account-block__line--named { border-left-color: var(--blood); color: var(--text); }
.closing-line {
  margin-top: var(--sp-5);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  font-family: var(--font-body);
  font-size: var(--fs-lg);
  font-style: italic;
  line-height: 1.5;
  color: var(--text);
}

/* ==========================================================================
   BUILD 5 — ART, ATMOSPHERE, AUDIO
   Later rules, deliberately overriding the Build 1–4 shapes.
   ========================================================================== */

/* ---------------------------------------------------------------- type ---
   Wood type for headings, a workmanlike serif for prose, typewriter for
   every figure in the game. Money is monospace. Always. */
.prose, .btn__hint, .beat, .objective__text, .account-block__line {
  font-family: var(--font-body);
  line-height: var(--lh-body);
}
.panel__head, .eyebrow, .heading, .modal__head, .dial__name, .stat__name,
.objective__label, .tag, .btn__label, .topbar__meta, .logline--head,
.order-head__name, .tut__title, .account-block__label {
  font-family: var(--font-display);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.btn__label { letter-spacing: .06em; font-weight: 600; font-size: var(--fs-md); }
.panel__head { font-size: var(--fs-md); font-weight: 700; }
.kv__v, .stat__val, .docket, .forecast__text, .ratchet, .ratchet-big__num,
.money, .btn__price, .creation__cost, .tally-head__big { font-family: var(--font-mono); }
.money, .kv__v, .stat__val, .btn__price { font-variant-numeric: tabular-nums; }

/* money inside a control keeps the typewriter, whatever the label does */
.btn__price {
  color: var(--gaslight);
  font-size: var(--fs-sm);
  letter-spacing: 0;
  text-transform: none;
}
.btn[disabled] .btn__price { color: var(--ash-faint); }

/* ------------------------------------------------------------- the docket
   The signature. Off-white stock, a torn head, a smudged stamp, ink that
   bleeds where the charges are, and it arrives from the bottom of the screen
   and has to be taken out of your hands. */
.docket {
  background:
    repeating-linear-gradient(0deg, rgba(25,23,18,.022) 0 1px, transparent 1px 4px),
    url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='180' height='180' filter='url(%23p)' opacity='.28'/></svg>"),
    linear-gradient(158deg, var(--paper) 0%, var(--paper-2) 62%, #CEC6B2 100%);
  background-size: auto, 180px 180px, auto;
  color: var(--paper-ink);
  transform: rotate(-1.1deg);
  box-shadow: 0 22px 46px rgba(0,0,0,.66), 0 2px 0 rgba(0,0,0,.3);
  padding: 30px 24px 22px;
  position: relative;
}
/* the torn head, cut with a mask so the paper itself ends raggedly */
.docket::before, .docket::after {
  content: '';
  position: absolute;
  left: -1px; right: -1px;
  height: 12px;
  background: inherit;
  background-attachment: local;
}
.docket::before {
  top: -10px;
  -webkit-mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='12' preserveAspectRatio='none'>\
<path d='M0 12 L4 5 L9 11 L15 3 L22 10 L28 4 L34 11 L41 6 L47 12 L54 4 L60 10 L67 5 L73 11 L80 3 L86 10 L93 6 L99 12 L106 5 L112 11 L120 7 L120 12 Z' fill='black'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='12' preserveAspectRatio='none'>\
<path d='M0 12 L4 5 L9 11 L15 3 L22 10 L28 4 L34 11 L41 6 L47 12 L54 4 L60 10 L67 5 L73 11 L80 3 L86 10 L93 6 L99 12 L106 5 L112 11 L120 7 L120 12 Z' fill='black'/></svg>");
  -webkit-mask-size: 120px 12px;
  mask-size: 120px 12px;
}
.docket::after {
  bottom: -10px;
  transform: scaleY(-1);
  -webkit-mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='12' preserveAspectRatio='none'>\
<path d='M0 12 L6 6 L13 11 L19 4 L26 10 L33 5 L39 12 L46 6 L52 11 L59 3 L65 10 L72 5 L78 12 L85 6 L91 11 L98 4 L104 10 L111 6 L120 11 L120 12 Z' fill='black'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='12' preserveAspectRatio='none'>\
<path d='M0 12 L6 6 L13 11 L19 4 L26 10 L33 5 L39 12 L46 6 L52 11 L59 3 L65 10 L72 5 L78 12 L85 6 L91 11 L98 4 L104 10 L111 6 L120 11 L120 12 Z' fill='black'/></svg>");
  -webkit-mask-size: 120px 12px;
  mask-size: 120px 12px;
}
.docket-enter { animation: docketIn .62s cubic-bezier(.16,.9,.3,1); }
@keyframes docketIn {
  from { transform: translateY(105vh) rotate(-5deg); }
  60%  { transform: translateY(-10px) rotate(-.4deg); }
  to   { transform: translateY(0) rotate(-1.1deg); }
}
/* the charges bleed into the stock; the wage does not */
.docket__section ~ .docket__item .amt {
  color: var(--paper-bleed);
  text-shadow: 0 0 1.1px rgba(92,31,24,.55), .4px .3px .6px rgba(92,31,24,.30);
}
.docket__item .lead { border-bottom-color: var(--paper-rule); }
.docket__works, .docket__title { font-family: var(--font-mono); }
.docket__stamp {
  border: 3px double var(--paper-stamp);
  color: var(--paper-stamp);
  transform: rotate(-6deg);
  opacity: .82;
  filter: blur(.24px);
  text-shadow: .4px .4px .8px rgba(122,44,36,.5);
  box-shadow: inset 0 0 6px rgba(122,44,36,.18);
}
.docket-wrap { perspective: 900px; }

/* ------------------------------------------------------------- the map ---
   An inked survey: hatching for the works district, the cut as a black scar,
   chimneys that smoke, and nodes stamped rather than clicked. */
.survey {
  position: relative;
  border: 1px solid var(--brick);
  background: #E8E2D2;
  line-height: 0;
  overflow: hidden;
}
.survey svg { width: 100%; height: auto; display: block; }
.map__node {
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: .08em;
  background: #DED7C4;
  color: #1C1A14;
  border: 2px solid #2A251C;
  border-radius: 2px;
  box-shadow: 1px 1px 0 rgba(0,0,0,.35);
  transform: rotate(-.6deg);
}
.map__node:nth-child(even) { transform: rotate(.7deg); }
.map__node:hover:not([disabled]) { background: #EFE9D8; border-color: var(--brick); }
.map__node--here {
  background: var(--gaslight);
  color: #1A1509;
  border-color: #2A251C;
  box-shadow: 0 0 0 3px rgba(224,162,74,.28), 1px 1px 0 rgba(0,0,0,.4);
}
.map__node--here .map__cost { color: #3A2E12; }
.map__node[disabled] {
  background: #C9C2B0;
  color: #4A4438;
  border-style: solid;
  border-color: #6B655A;
  background-image: repeating-linear-gradient(46deg, rgba(26,24,18,.5) 0 2px, transparent 2px 7px);
}
.map__cost { font-family: var(--font-mono); color: #3E382C; }

/* ----------------------------------------------------------- minigames ---
   Short, physical, and skippable. The canvas is only alive while it is open. */
.mini {
  position: relative;
  background: #0D0F12;
  border: 1px solid var(--brick);
  overflow: hidden;
}
.mini canvas { display: block; width: 100%; height: auto; }
.mini__hud {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3);
  border-top: 1px solid var(--line);
  background: var(--slate);
}
.mini__label {
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: var(--fs-sm);
  color: var(--ash-dim);
}
.mini__score { font-family: var(--font-mono); font-size: var(--fs-md); color: var(--gaslight); }
.mini__instruction {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--ash);
  padding: var(--sp-3);
  border-left: 3px solid var(--brick);
}
.mini__verdict {
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: .16em;
  font-size: var(--fs-lg);
}
.mini__verdict--good { color: var(--verdigris-text); }
.mini__verdict--ok   { color: var(--ash); }
.mini__verdict--bad  { color: var(--rust-text); }
.shake { animation: shakeIt .28s linear; }
@keyframes shakeIt {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-3px,1px); }
  50% { transform: translate(2px,-2px); }
  75% { transform: translate(-2px,2px); }
}

/* ------------------------------------------------------------- settings ---*/
.settings__row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: 1px dotted var(--line-soft);
}
.settings__name { font-family: var(--font-body); font-size: var(--fs-md); color: var(--ash); }
.settings__note { font-family: var(--font-body); font-size: var(--fs-sm); color: var(--ash-faint); }
.toggle {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  min-width: 78px;
  text-align: center;
  padding: 7px 10px;
  border: 1px solid var(--line);
  background: var(--slate-2);
  color: var(--ash-dim);
}
.toggle[aria-pressed="true"] { border-color: var(--gaslight); color: var(--gaslight); background: #2A2419; }
.settings__master { border: 1px solid var(--brick); padding: var(--sp-3); margin-bottom: var(--sp-3); }

/* numbers tick, they never spin */
.tick { display: inline-block; font-variant-numeric: tabular-nums; }

/* ---- css/atmosphere.css ---- */
/* ==========================================================================
   GRIMWICK WORKS — atmosphere.css   (Build 5)

   Six layers, each switched by a class on <html>, each one independent, and
   all of them off under .plain-ledger.

     .atmo-grain     1.5% soot, CSS only, no canvas, no loop
     .atmo-gaslight  a 4s flicker on LIGHT SOURCES IN THE ART. never on text.
     .atmo-smoke     one drifting haze at the top of the viewport
     .atmo-rain      outdoor nodes only, and only when it is actually raining
     .atmo-season    handled in tokens.css: the season moves the GROUND
     .atmo-vignette  edges only, and it never reaches the text column

   Nothing in this file may reduce the contrast of a glyph. Layers that sit
   over content are capped at 1.5%; everything heavier sits behind it.
   ========================================================================== */

/* the atmosphere host: behind the app, above the page ground */
#atmo {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
#app { position: relative; z-index: 1; }

/* ---------------------------------------------------------------- 1. SOOT */
html.atmo-grain body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  opacity: .015;                     /* measured: no pair loses more than .1:1 */
  background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter>\
<rect width='160' height='160' filter='url(%23n)'/></svg>");
  background-size: 160px 160px;
}

/* ------------------------------------------------------------ 2. GASLIGHT
   Only ever applied to art: lamps, furnace mouths, lit windows. Never type. */
html.atmo-gaslight .gw-win,
html.atmo-gaslight .gw-lamp { animation: gwFlicker 4s ease-in-out infinite; }
html.atmo-gaslight .gw-fire { animation: gwFire .5s steps(2, end) infinite; }
html.atmo-gaslight .gw-glow { animation: gwGlow 2.6s ease-in-out infinite; }
html.atmo-gaslight .lamp-glow { animation: gwFlicker 4s ease-in-out infinite; }
@keyframes gwFlicker {
  0%, 100% { opacity: .74; }
  42%      { opacity: .52; }
  47%      { opacity: .88; }
  63%      { opacity: .60; }
}
@keyframes gwFire { 0%,100% { transform: scaleY(1); opacity: .95; } 50% { transform: scaleY(1.22); opacity: .8; } }
@keyframes gwGlow { 0%,100% { opacity: .34; } 50% { opacity: .62; } }

/* --------------------------------------------------------------- 3. SMOKE */
#atmo-smoke {
  position: absolute;
  top: -6%; left: -20%;
  width: 140%;
  height: 52%;
  opacity: 0;
  transition: opacity .4s linear;
  will-change: transform;
}
html.atmo-smoke #atmo-smoke { opacity: 1; }
/* two soft bands, drifting against each other. no filters: a full-viewport
   gaussian blur costs half the frame budget and buys nothing a gradient
   cannot do. */
#atmo-smoke .haze {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 40% 58% at 26% 34%, rgba(110,116,124,.30), transparent 70%),
    radial-gradient(ellipse 46% 50% at 68% 20%, rgba(110,116,124,.24), transparent 72%),
    radial-gradient(ellipse 60% 40% at 48% 62%, rgba(110,116,124,.16), transparent 76%);
  animation: hazeDrift 72s ease-in-out infinite alternate;
  will-change: transform;
}
#atmo-smoke .haze--b {
  background:
    radial-gradient(ellipse 52% 44% at 74% 40%, rgba(126,132,140,.20), transparent 74%),
    radial-gradient(ellipse 38% 52% at 18% 22%, rgba(126,132,140,.16), transparent 70%);
  animation-duration: 104s;
  animation-direction: alternate-reverse;
}
@keyframes hazeDrift {
  from { transform: translate3d(-4%, 0, 0) scale(1.02); }
  to   { transform: translate3d(4%, 1%, 0) scale(1.08); }
}

/* ---------------------------------------------------------------- 4. RAIN */
#atmo-rain {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .5s linear;
  background-image:
    repeating-linear-gradient(102deg, rgba(201,196,184,.16) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(98deg,  rgba(201,196,184,.10) 0 1px, transparent 1px 9px);
  background-size: 100% 140px, 100% 220px;
}
html.atmo-rain body.outdoors.wet #atmo-rain { opacity: 1; animation: rainFall 1.1s linear infinite; }
@keyframes rainFall {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 0 140px, 0 220px; }
}

/* ------------------------------------------------------------ 6. VIGNETTE
   It lives inside #atmo, which sits BEHIND the app. It darkens the page
   ground and the gutters and it is structurally incapable of touching a
   glyph, because every panel that carries text paints its own opaque
   background over it. That is the guarantee, not a tuning. */
#atmo-vignette {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .4s linear;
  background: radial-gradient(ellipse 82% 74% at 50% 44%,
    transparent 0 58%, rgba(4,5,7,.42) 86%, rgba(4,5,7,.62) 100%);
}
html.atmo-vignette #atmo-vignette { opacity: 1; }

/* --------------------------------------------------- PLAIN LEDGER MODE
   One switch. Everything decorative goes; the game is unchanged underneath. */
html.plain-ledger body::after,
html.plain-ledger #atmo { display: none !important; }
html.plain-ledger .gw-svg,
html.plain-ledger .station-art,
html.plain-ledger .works-banner { display: none !important; }
html.plain-ledger * { animation: none !important; transition: none !important; }
html.plain-ledger .docket { transform: none !important; box-shadow: none !important; }
html.plain-ledger .docket::before,
html.plain-ledger .docket::after { display: none !important; }

/* ----------------------------------------------------------------- MOTION
   Restrained by default; gone entirely when the reader asks for it. */
.fade-in { animation: fade .2s linear; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.crossfade { animation: crossfade .2s ease-out; }
@keyframes crossfade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* the wheel, the ram, the pour, the sparks — the machinery of the art */
.gw-wheel, .gw-ram, .gw-ladle, .gw-flag { transform-box: fill-box; transform-origin: center; }
.gw-wheel { animation: gwSpin 1.1s linear infinite; }
@keyframes gwSpin { to { transform: rotate(360deg); } }
.gw-ram { animation: gwRam 1.55s cubic-bezier(.6,0,.9,.4) infinite; }
@keyframes gwRam {
  0%, 40%  { transform: translateY(0); }
  52%      { transform: translateY(46px); }
  60%      { transform: translateY(44px); }
  100%     { transform: translateY(0); }
}
.gw-shock { animation: gwShock 1.55s linear infinite; }
@keyframes gwShock { 0%,50% { opacity: 0; } 53% { opacity: .9; } 62%,100% { opacity: 0; } }
.gw-spark { animation: gwSpark .9s ease-out infinite; }
@keyframes gwSpark { 0% { opacity: 0; } 6% { opacity: .95; } 40% { opacity: 0; } 100% { opacity: 0; } }
.gw-dust circle { animation: gwDust 7s linear infinite; }
@keyframes gwDust { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .5; } 100% { transform: translateY(-90px); opacity: 0; } }
.gw-belt { stroke-dasharray: 10 8; animation: gwBelt .6s linear infinite; }
@keyframes gwBelt { to { stroke-dashoffset: -18; } }
.gw-smoke { animation: gwSmoke 9s linear infinite; }
@keyframes gwSmoke {
  0%   { opacity: 0;   transform: translate(0, 0) scale(.4); }
  12%  { opacity: .55; }
  100% { opacity: 0;   transform: translate(-70px, -120px) scale(2.6); }
}
.gw-smoke2 { animation-duration: 11s; }
.gw-smoke3 { animation-duration: 8s; }
.gw-flag { animation: gwFlag 2.8s ease-in-out infinite; }
@keyframes gwFlag { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-3deg) scaleX(.94); } }
.gw-ladle { animation: gwLadle 6s ease-in-out infinite; }
@keyframes gwLadle { 0%,55%,100% { transform: rotate(0deg); } 70%,85% { transform: rotate(11deg); } }
.gw-pour { animation: gwPour 6s ease-in-out infinite; opacity: 0; }
@keyframes gwPour { 0%,60%,100% { opacity: 0; } 70%,84% { opacity: 1; } }

/* the chimney icons on the map actually smoke */
.map-chimney { animation: mapSmoke 7s ease-in-out infinite; }
@keyframes mapSmoke {
  0%   { opacity: 0; transform: translateY(0) scale(.6); }
  25%  { opacity: .5; }
  100% { opacity: 0; transform: translateY(-14px) scale(1.5); }
}

/* --------------------------------------------------- REDUCED MOTION
   Complete. No exceptions, no partial credit. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }

  .docket { transform: rotate(-.6deg) !important; }
}

      result: 'Three of the four pay. The fourth has nothing, and everyone knows she has nothing, and it is done anyway.' },
    { text: 'Write to Kell about the stair', hint: 'You would have to be able to write.',
      requires: { stats: { literacy: { min: 2 } } },
      effects: { mind: { resolve: 2 }, flags: { wroteToKell: true } },
      result: 'He does not answer. In six weeks a man comes and looks at the stair, and does not go up onto the roof, and leaves.' },
    { text: 'Put a pail under it', hint: 'It is a pail. It works as well as a pail works.',
      effects: { body: { warmth: -3 } },
      result: 'The pail fills twice in the night and the sound of it is the sound of the whole winter.' }
  ]
},
{
  id: 'ho_coalShort', cat: 'household', phase: 'NIGHT', weight: 7,
  requires: { housed: true, stats: { coal: { max: 0 } } },
  title: 'NO FIRE',
  text: 'There is nothing in the grate and nothing in the sack, and it is the kind of cold that gets into the bedding and stays there. The bakehouse two doors down has a wall that is warm on the outside until about midnight.',
  choices: [
    { text: 'Sit against the bakehouse wall', hint: 'Outside, but warm. Until midnight.',
      effects: { body: { warmth: 10, fatigue: 6 }, kin: { mood: -2 } },
      result: 'Four of you from the row sit against the same warm bricks in the dark and nobody makes anything of it.' },
    { text: 'Break up the chair', hint: 'It burns for two hours. Then there is no chair.',
      effects: { body: { warmth: 16 }, mind: { resolve: -6 }, flags: { burnedTheChair: true } },
      result: 'It gives two hours of real heat and a smell of varnish, and in the morning there is one chair in the room instead of two.' },
    { text: 'Go to bed in everything you own', hint: 'Free. Not enough.',
      effects: { body: { warmth: -4 }, kin: { health: -3 } },
      result: 'Coats, the shawl, the rag rug off the floor. You lie there listening to each other not sleeping.' }
  ]
},
{
  id: 'ho_neighbourBorrow', cat: 'household', phase: 'EVENING', weight: 7,
  requires: { housed: true },
  title: 'MOTHER ASHEN AT THE DOOR',
  text: 'Mother Ashen from the floor below wants the loan of a shovel of coal until Friday. She has asked before. She has also paid it back before, twice, and not the third time.',
  choices: [
    { text: 'Give her the shovelful', hint: 'A night of your fire.',
      requires: { stats: { coal: { min: 1 } } },
      effects: { coal: -1, standing: { workmates: 5 }, mind: { resolve: 4 }, flags: { lentCoal: true } },
      result: 'She takes it in a bucket with a cloth over it so the row does not see, and says Friday, and means it.' },
    { text: 'Say you have none', hint: 'She will hear your grate going through the floor.',
      effects: { mind: { resolve: -5 }, standing: { workmates: -4 } },
      result: 'She says of course, love, and goes back down, and your fire is audible through her ceiling all evening.' }
  ]
},
{
  id: 'ho_kellRepairs', cat: 'household', phase: 'EVENING', weight: 6,
  requires: { housed: true, minAct: 2 },
  title: 'KELL PUTS THE RENT UP',
  text: 'A printed notice on the stairhead: rents in the Row rise by fourpence a week from the quarter day, on account of improvements. The only improvement anybody can identify is the notice, which is printed.',
  choices: [
    { text: 'Pay it and say nothing', hint: 'Everybody will pay it.',
      effects: { mind: { resolve: -4 }, flags: { rentRaised: true } },
      result: 'Everybody pays it. Fourpence a week is a loaf and a half, which is exactly how it will be measured from now on.' },
    { text: 'Get the four households to refuse together', hint: 'Four households, one landlord, and he only needs to evict one of you.',
      effects: { standing: { workmates: 8 }, mind: { resolve: 6 }, flags: { rentStrike: true, rentRaised: true } },
      result: 'Three of the four agree on the stairhead. By Thursday one has paid privately, and by Friday everyone knows which one.' }
  ]
},
{
  id: 'ho_pawnTicketExpires', cat: 'household', phase: 'EVENING', weight: 6,
  requires: { flags: { hasTicketOut: true } },
  title: 'A TICKET RUNNING OUT',
  text: 'Ostrek sends a boy up with a note: the ticket on your things has three days left on it, after which what is in his window belongs to whoever wants it. He is not threatening. He is telling you the date.',
  choices: [
    { text: 'Go and renew the ticket', hint: 'A penny buys another month.',
      requires: { stats: { pennies: { min: 1 } } },
      effects: { purse: { pennies: -1 }, mind: { resolve: 2 } },
      result: 'A penny, a new date written in, and the thing stays under his counter for another month, being yours in the technical sense.' },
    { text: 'Let it go', hint: 'It is a watch. It is not bread.',
      effects: { mind: { resolve: -8 }, flags: { lostTheTicket: true } },
      result: 'It is in the window by Saturday with a card on it. You take the other side of the street for about a fortnight.' }
  ]
},
{
  id: 'ho_sundayDinner', cat: 'household', phase: 'EVENING', weight: 5,
  requires: { housed: true, kin: true, stats: { pennies: { min: 8 } } },
  title: 'A PIECE OF MEAT',
  text: 'There is a shoulder end at the butcher’s for sevenpence that would do the two of you for two days and be the first meat in the room this month. Sevenpence is also two days of coal.',
  choices: [
    { text: 'Buy the meat', hint: 'Two days of eating like people.',
      effects: { purse: { pennies: -7 }, larder: 3, kin: { mood: 14, health: 4 }, mind: { resolve: 6 } },
      result: 'It is boiled with two onions and it is the best hour of the month and it is gone by Tuesday.' },
    { text: 'Buy the coal instead', hint: 'Warmth outlasts the meal.',
      effects: { purse: { pennies: -7 }, coal: 2, kin: { mood: -4 } },
      result: 'You are warm and you have not eaten meat since the spring, and both of those things are correct decisions.' }
  ]
},
{
  id: 'ho_letterHome', cat: 'household', phase: 'EVENING', weight: 5,
  requires: {},
  title: 'A LETTER FROM THE COUNTRY',
  text: 'A letter comes up from the parish your mother was born in: an uncle is dead, there is a matter of eleven shillings and a bed, and it wants an answer in writing within the month.',
  choices: [
    { text: 'Read it yourself', hint: 'You would need your letters.',
      requires: { stats: { literacy: { min: 2 } } },
      effects: { mind: { resolve: 3 }, purse: { pennies: 22 }, flags: { gotTheLegacy: true } },
      result: 'Eleven shillings, less the carriage and the writing of the reply. It is the largest sum you have held at one time in three years.' },
    { text: 'Pay the scribe on the square to read it', hint: 'Tuppence, and he reads it aloud in the open.',
      requires: { stats: { pennies: { min: 2 } } },
      effects: { purse: { pennies: 20 }, mind: { resolve: -2 }, flags: { gotTheLegacy: true } },
      result: 'He reads it out in the square in a carrying voice and four people learn about your uncle before you do. The money is real.' },
    { text: 'Put it behind the clock', hint: 'It will still be there next month.',
      effects: { mind: { resolve: -3 }, flags: { ignoredTheLetter: true } },
      result: 'It stays behind the clock. In six weeks a second letter comes saying the matter is closed.' }
  ]
},

/* --------------------------------------------------------------------- KIN */
{
  id: 'ki_wantsToWork', cat: 'kin', phase: 'EVENING', weight: 8,
  requires: { kin: true, flags: { kinKind: 'sister' }, notFlags: ['putKinToWork'] },
  title: 'SHE ASKS AGAIN',
  text: 'Tamsin has heard that Anne Corrie at the cap bench brings home six pence a shift, and she has done the arithmetic on the table with a piece of chalk, and she is right about the arithmetic.',
  choices: [
    { text: 'Tell her no again', hint: 'You cannot tell her the real reason without frightening her.',
      effects: { kin: { mood: -8 }, mind: { resolve: -3 } },
      result: 'She says it is not fair, and she is nine, and it is not fair, and you cannot explain the shake to a person who has never had steady hands taken away.' },
    { text: 'Tell her exactly what the fulminate does', hint: 'She is nine. She will believe you and it will not stop her asking.',
      effects: { kin: { mood: -4, health: 0 }, mind: { resolve: 4 }, flags: { toldHerTheTruth: true } },
      result: 'You tell her about the hands. She listens properly, the way children do, and then asks whether six pence a shift would pay the rent, and it would.' }
  ]
},
{
  id: 'ki_fatherOffers', cat: 'kin', phase: 'EVENING', weight: 8,
  requires: { kin: true, flags: { kinKind: 'father' } },
  title: 'HE WANTS TO GO BACK ON',
  text: 'Ost has got his boots on and is sitting by the door with them on. He says they will take him back on the casting floor for half rate and half the hours, and he could do half the hours, and he could not do half the hours.',
  choices: [
    { text: 'Take his boots off him', hint: 'He will not forgive it quickly.',
      effects: { kin: { mood: -12, health: 5 }, mind: { resolve: -4 } },
      result: 'He lets you. That is the worst part of it: he lets you, without much of an argument, because he already knew.' },
    { text: 'Let him try one shift', hint: 'It is his trade. It was his trade before it was yours.',
      effects: { kin: { health: -14, mood: 10 }, purse: { pennies: 13 }, flags: { fatherWorked: true } },
      result: 'He does the shift. He is paid thirteen pence and he cannot get up the stairs afterwards, and he is happier than you have seen him since the spring.' }
  ]
},
{
  id: 'ki_childFever', cat: 'kin', phase: 'NIGHT', weight: 9,
  requires: { kin: true, stats: { kinHealth: { max: 55 } } },
  title: 'HOT IN THE NIGHT',
  text: 'They are hot to the touch and the heat is the dry kind. In the Rows this is either three days of nothing or it is the thing that empties the room, and there is no way to tell which from the doorway at two in the morning.',
  choices: [
    { text: 'Sit up with them', hint: 'It does nothing medical. It is not nothing.',
      effects: { body: { fatigue: 18 }, kin: { mood: 10, health: 2 }, mind: { resolve: 2 } },
      result: 'You sit up with a candle-end and the fever breaks a little towards five, or seems to, which is what people mean by it breaking.' },
    { text: 'Give them the physic', hint: 'Uses the bottle.',
      requires: { stats: { physic: { min: 1 } } },
      effects: { physic: -1, kin: { health: 16, mood: 6 } },
      result: 'It goes down and stays down and by morning they are only tired, which here counts as recovery.' },
    { text: 'Fetch Mrs. Bligh out of her bed', hint: 'She will come. She will also be owed.',
      effects: { purse: { debt: 26 }, kin: { health: 22 }, flags: { blighCame: true } },
      result: 'She comes in her nightdress with a coat over it, does four competent things in eleven minutes, and does not mention the money until the morning.' }
  ]
},
{
  id: 'ki_schooling', cat: 'kin', phase: 'EVENING', weight: 6,
  requires: { kin: true, housed: true },
  title: 'THE RAGGED SCHOOL',
  text: 'There is a free school in the chapel undercroft on three evenings a week: letters, numbers, and a great deal about obedience. It is free, and the hours it takes are hours that could be spent earning or minding.',
  choices: [
    { text: 'Send them', hint: 'Letters are the only thing in Grimwick that cannot be pawned.',
      effects: { kin: { mood: 6 }, mind: { resolve: 3 }, flags: { kinAtSchool: true } },
      result: 'They come back able to write four words and full of a story about Jonah, and the four words are the part that matters.' },
    { text: 'Keep them at the table winding paper', hint: 'It is threepence a week from home.',
      effects: { purse: { pennies: 3 }, kin: { mood: -6 } },
      result: 'Threepence a week and a set of hands that will be good at winding paper, which is a trade that will not exist in fifteen years.' }
  ]
},
{
  id: 'ki_kinSteals', cat: 'kin', phase: 'EVENING', weight: 6,
  requires: { kin: true, stats: { larder: { max: 0 } } },
  title: 'SOMETHING IN THE POCKET',
  text: 'There is half a loaf in the room that you did not buy and nobody will say where it came from, and the shop at the corner of Sallow Street has a boy who watches the door.',
  choices: [
    { text: 'Take it back to the shop', hint: 'Honest, and it costs you the half loaf and possibly the child.',
      effects: { larder: -1, mind: { resolve: 4 }, standing: { notice: 3 }, flags: { returnedTheLoaf: true } },
      result: 'The shopman takes it, and looks at the child for a long moment, and decides not to send for anybody. He could have.' },
    { text: 'Eat it and say nothing', hint: 'It is half a loaf and you have nothing.',
      effects: { body: { hunger: -12 }, mind: { resolve: -5 }, flags: { ateTheStolenLoaf: true } },
      result: 'It is eaten in about four minutes between the two of you and nobody says anything and everybody understands the arrangement now.' },
    { text: 'Make them take it back themselves', hint: 'A lesson, delivered at the worst possible time.',
      effects: { kin: { mood: -10 }, mind: { resolve: 2 }, standing: { notice: 2 } },
      result: 'They go, and come back without it, and do not speak for the rest of the evening, and they will remember this one.' }
  ]
},
{
  id: 'ki_kinFriend', cat: 'kin', phase: 'EVENING', weight: 5,
  requires: { kin: true },
  title: 'SOMEBODY FROM THE BENCH',
  text: 'Lisbet Vaunce from the cap bench has walked home with Tamsin two evenings running and is on the stair now with a paper of broken biscuit to share out. She is fourteen and has been on the bench since she was ten.',
  choices: [
    { text: 'Ask her in', hint: 'There is not much in the room, but there is a room.',
      effects: { kin: { mood: 10 }, standing: { workmates: 4 }, mind: { resolve: 4 }, larder: 1 },
      result: 'She eats the biscuit, tells four jokes, and shows Tamsin the way she holds a scoop so it does not tire the thumb. Her own hands are not steady.' },
    { text: 'Send her home', hint: 'Where she has been going since she was ten.',
      effects: { kin: { mood: -6 }, standing: { workmates: -2 } },
      result: 'She goes without any fuss at all, which is the thing that stays with you.' }
  ]
},
{
  id: 'ki_kinDoubts', cat: 'kin', phase: 'NIGHT', weight: 6,
  requires: { kin: true, stats: { resolve: { max: 30 } } },
  title: 'THEY ASK WHAT HAPPENS NEXT',
  text: 'From the other side of the room, in the dark, they ask what happens if you cannot work. They have clearly been holding the question for some days, and have chosen the dark to ask it in so as not to have to see your face.',
  choices: [
    { text: 'Tell them the truth', hint: 'The workhouse separates the wards. They are old enough to be told.',
      effects: { kin: { mood: -10 }, mind: { resolve: 6 }, flags: { toldThemTheTruth: true } },
      result: 'You tell them about the wards and the separation and the rest of it. They are quiet for a while, and then say, all right. All right.' },
    { text: 'Tell them it will not happen', hint: 'A lie, told kindly, which they will remember either way.',
      effects: { kin: { mood: 6 }, mind: { resolve: -6 } },
      result: 'They accept it because they want to. You lie there afterwards doing the arithmetic that proves it was a lie.' }
  ]
},
/* ---------------------------------------------------------------- SOLDIERS */
{
  id: 'so_billeting', cat: 'soldiers', phase: 'EVENING', weight: 7,
  requires: { housed: true, minAct: 1 },
  title: 'BILLETING',
  text: 'Two men of the line are billeted along Cinder Row under the Act, and the row is expected to feed them at fourpence a day, which is not what feeding a soldier costs. One of them is nineteen and from a county you have never been to.',
  choices: [
    { text: 'Take one of them in', hint: 'Fourpence a day and a man in your room.',
      effects: { purse: { pennies: 4 }, larder: -1, kin: { mood: -4 }, standing: { garrison: 6 } },
      result: 'He sleeps by the door, eats what you eat, apologises for the amount of it, and tells you the regiment is for the eastern frontier in the spring.' },
    { text: 'Say the room will not hold another', hint: 'True, and refusing is noted.',
      effects: { standing: { garrison: -8, notice: 4 }, mind: { resolve: 2 } },
      result: 'The corporal writes the number of the house down. The two of them go to number eleven, which has less room than you have.' }
  ]
},
{
  id: 'so_deserter', cat: 'soldiers', phase: 'EVENING', weight: 6,
  requires: { minAct: 2 },
  title: 'A MAN IN THE COAL YARD',
  text: 'There is a man asleep behind the coal heaps in an army shirt with the facings cut off. He is about twenty and has not eaten for two days and there is a standing reward of a crown for a deserter delivered to the post.',
  choices: [
    { text: 'Feed him and say nothing', hint: 'A crown is a crown, and he is twenty.',
      requires: { stats: { larder: { min: 1 } } },
      effects: { larder: -1, mind: { resolve: 8 }, standing: { notice: 6 }, flags: { fedTheDeserter: true } },
      result: 'He eats standing up in about ninety seconds and is gone before dark, north, on the rails, which is the only direction there is.' },
    { text: 'Take the reward to the post', hint: 'A crown. Five shillings. Nine days of bread.',
      effects: { purse: { pennies: 60 }, mind: { resolve: -14 }, standing: { garrison: 10, workmates: -12 }, flags: { soldTheDeserter: true } },
      result: 'They pay it at the counter in silver and the corporal writes your name in the book, and the coal yard is quiet for a long time afterwards.' },
    { text: 'Leave him where he is', hint: 'The patrols come through at eleven.',
      effects: { mind: { resolve: -3 } },
      result: 'The patrols come through at eleven. You hear about it at the bench in the morning from a man who watched it happen.' }
  ]
},
{
  id: 'so_drill', cat: 'soldiers', phase: 'EVENING', weight: 6,
  requires: { location: 'market' },
  title: 'BAYONET DRILL IN THE SQUARE',
  text: 'A company is at bayonet exercise in the market square for the edification of the town: point, guard, thrust, recover, forty men in a line. The blades came off your wheel, or off the wheel next to yours, in the last fortnight.',
  choices: [
    { text: 'Watch the blades', hint: 'You know exactly how they were finished.',
      effects: { mind: { resolve: -4 }, flags: { sawTheDrill: true } },
      result: 'You can see the grind marks from four yards. You could pick out the shed they came from. Somebody in a square somewhere is going to meet that edge.' },
    { text: 'Get on with the evening', hint: 'It is a display and you have two hours.',
      effects: {},
      result: 'The drum keeps time behind you all the way up Sallow Street and then stops mid-bar for the serjeant to correct somebody.' }
  ]
},
{
  id: 'so_slate', cat: 'soldiers', phase: 'EVENING', weight: 6,
  requires: { location: 'ewe' },
  title: 'A SOLDIER’S SLATE',
  text: 'A corporal has run up eleven pence on Moll Tarrow’s slate and the regiment moves on Thursday. Moll cannot go to the garrison about it and everybody in the room knows she cannot.',
  choices: [
    { text: 'Say something to him about it', hint: 'In front of the room. That is the only way it works.',
      effects: { standing: { workmates: 7, garrison: -8 }, mind: { resolve: 5 } },
      result: 'He pays four of the eleven on the spot to end the conversation, which is four more than Moll expected, and he does not forget your face.' },
    { text: 'Let it alone', hint: 'The garrison is the garrison.',
      effects: { mind: { resolve: -3 } },
      result: 'He goes on Thursday owing eleven pence. Moll rubs it off the slate herself on the Friday and says nothing about it, ever.' }
  ]
},
{
  id: 'so_proclamation', cat: 'soldiers', phase: 'EVENING', weight: 7,
  requires: { minAct: 2 },
  title: 'A PROCLAMATION ON THE BOARD',
  text: 'A new proclamation is nailed up by the pump: assemblies of more than twelve persons in the borough of Grimwick require the written permission of the magistrate, on account of the disturbances elsewhere. There have been no disturbances here.',
  choices: [
    { text: 'Read it out for the men who cannot', hint: 'Somebody will have to. It might as well be accurate.',
      requires: { stats: { literacy: { min: 2 } } },
      effects: { standing: { workmates: 6, notice: 8 }, mind: { resolve: 3 }, flags: { readTheProclamation: true } },
      result: 'You read it twice through because they ask you to. A man at the back writes down which parts they made you repeat.' },
    { text: 'Read it to yourself and move off', hint: 'Knowing it is enough.',
      requires: { stats: { literacy: { min: 1 } } },
      effects: { standing: { notice: 1 }, flags: { readTheProclamation: true } },
      result: 'Twelve persons. You count the men round the board without meaning to. Fourteen.' },
    { text: 'Wait to be told what it says', hint: 'It will reach you third-hand and half wrong.',
      effects: { mind: { resolve: -2 } },
      result: 'By the time it reaches the Ewe it has become a ban on meetings of any kind and a curfew that does not exist.' }
  ]
},
{
  id: 'so_invalid', cat: 'soldiers', phase: 'EVENING', weight: 6,
  requires: { minAct: 1 },
  title: 'AN INVALID OF THE COLONIAL SERVICE',
  text: 'A man is sitting on the chapel steps with his discharge papers spread on his knee so that people can see they are genuine. He has one hand and a pension of ninepence a week and has been sitting there since eleven in the morning.',
  choices: [
    { text: 'Give him a penny', hint: 'You have very little and he has ninepence a week.',
      requires: { stats: { pennies: { min: 1 } } },
      effects: { purse: { pennies: -1 }, mind: { resolve: 4 } },
      result: 'He thanks you by regiment and number, which is how he thanks everybody, because it is the only formal thing he has left.' },
    { text: 'Ask him what it was like', hint: 'He will tell you. That is the risk.',
      effects: { mind: { resolve: -6 }, flags: { heardTheFrontier: true } },
      result: 'He describes a square at a river crossing for four minutes in an entirely level voice, and you go home with it, and it stays.' }
  ]
},

/* ------------------------------------------------------------------- CRIME */
{
  id: 'cr_fence', cat: 'crime', phase: 'EVENING', weight: 7,
  requires: { employed: true, minAct: 1 },
  title: 'A MAN WHO BUYS CAPS',
  text: 'A man in the snug of the Ewe will pay threepence a hundred for percussion caps and does not ask how they leave the Works. The gate search is done by two men who search perhaps one in six.',
  choices: [
    { text: 'Take out a hundred', hint: 'Threepence. One in six are searched.',
      effects: { purse: { pennies: 3 }, standing: { notice: 10 }, flags: { stealingCaps: true }, mind: { resolve: -3 } },
      result: 'A hundred caps is a handful. You are not searched. It is the not being searched that makes the second time easy.' },
    { text: 'Tell him you are not interested', hint: 'He will ask somebody else within the hour.',
      effects: { mind: { resolve: 2 } },
      result: 'He shrugs and moves along the bench and is talking to somebody else before you have finished your drink.' }
  ]
},
{
  id: 'cr_coining', cat: 'crime', phase: 'EVENING', weight: 6,
  requires: {},
  title: 'A BAD SHILLING',
  text: 'You are given a shilling in your change that rings wrong on the counter. Pewter, washed, and rather well made. Passing it on is a felony. Not passing it on costs you a shilling, which is a day.',
  choices: [
    { text: 'Pass it at the market in the dark', hint: 'It is a felony and it is a day’s wage.',
      effects: { purse: { pennies: 12 }, standing: { notice: 8 }, mind: { resolve: -5 }, flags: { passedBadCoin: true } },
      result: 'The woman at the barrow takes it without looking and gives you eleven pence change, and it is somebody else’s problem now, and you know exactly whose sort of somebody.' },
    { text: 'Take it back to where you got it', hint: 'They will say you brought it in.',
      effects: { mind: { resolve: 3 }, standing: { workmates: -2 } },
      result: 'He says he never gave it you and he is possibly telling the truth, and you leave with the shilling still in your hand.' },
    { text: 'Put it in the fire', hint: 'A day’s wage, gone, and nobody defrauded.',
      effects: { mind: { resolve: 6 }, flags: { burnedTheCoin: true } },
      result: 'It goes soft at the edges and sits in the ash looking like exactly what it is. It is the most expensive thing you have ever done on principle.' }
  ]
},
{
  id: 'cr_burglary', cat: 'crime', phase: 'EVENING', weight: 6,
  requires: { housed: true },
  title: 'NUMBER SIX HAS BEEN DONE',
  text: 'Somebody has been into number six through the back and taken a clock, a coat and four shillings in a jar. The row has decided within about an hour that it was one of the casuals from the lodging house on Kell Street.',
  choices: [
    { text: 'Say it was probably somebody from the row', hint: 'It was probably somebody from the row.',
      effects: { standing: { workmates: -8 }, mind: { resolve: 4 }, flags: { saidTheTruth: true } },
      result: 'Nobody wants it said. It is much better for everybody if it was a stranger, and by evening it is settled that it was.' },
    { text: 'Go along with the lodging house', hint: 'It is easy and it is what everybody has decided.',
      effects: { standing: { workmates: 4 }, mind: { resolve: -4 } },
      result: 'Two men from the row go and turn the lodging house over on Thursday, and find nothing, and that is not taken as evidence of anything.' }
  ]
},
{
  id: 'cr_garrotting', cat: 'crime', phase: 'EVENING', weight: 5,
  requires: { minAct: 2 },
  title: 'IN THE ALLEY OFF SALLOW STREET',
  text: 'Two men have a third against the wall in the alley and one of them has an arm across his throat from behind. It is being done quietly and quickly by people who have done it before.',
  choices: [
    { text: 'Shout and run at them', hint: 'Two of them, and you.',
      effects: { body: { health: -8, fatigue: 10 }, mind: { resolve: 8 }, standing: { workmates: 4 } },
      result: 'They go over the wall. The man on the ground has a bitten tongue and no watch, and thanks you, and you have a knuckle you cannot bend.' },
    { text: 'Fetch the garrison patrol', hint: 'Two streets. Two minutes. It is a long two minutes.',

/* ---- js/strings.js ---- */
/* ==========================================================================
   GRIMWICK WORKS — js/strings.js
   The lookup engine for data/strings.js. Logic files call T('a.b.c').
   No English lives here either — only the machinery that fetches it.
   ========================================================================== */

function T(path, params) {
  var node = STR, parts = String(path).split('.'), i;
  for (i = 0; i < parts.length; i++) {
    if (node == null || typeof node !== 'object' || !(parts[i] in node)) {
      if (typeof console !== 'undefined' && console.warn) {
        console.warn('[strings] missing key: ' + path);
      }
      return '';
    }
    node = node[parts[i]];
  }
  if (typeof node === 'string') return params ? interpolate(node, params) : node;
  return node;
}

function interpolate(text, params) {
  return text.replace(/\{(\w+)\}/g, function (m, k) {
    return (params && k in params) ? String(params[k]) : m;
  });
}

/* Five-band descriptor for a 0..100 stat: bands.<name> arrays in strings. */
function band(value, bandsKey, invert) {
  var arr = T('bands.' + bandsKey);
  if (!arr || !arr.length) return '';
  var v = invert ? 100 - value : value;
  var idx = Math.min(arr.length - 1, Math.max(0, Math.floor(v / (100 / arr.length))));
  return arr[idx];
}

/* -100..100 standing -> descriptor */
function standingBand(value) {
  var arr = T('bands.standing');
  var idx = Math.min(arr.length - 1, Math.max(0, Math.floor((value + 100) / (200 / arr.length))));
  return arr[idx];
}

        b[k] = Util.clamp100(b[k] + Math.max(0, d[k]));

/* ==========================================================================
   GRIMWICK WORKS — js/economy.js
   Money, charges, and the wage docket.
   12 pence = 1 shilling. 20 shillings = 1 crown. Never a decimal.
   ========================================================================== */

var Economy = {

  /* ---- money ---------------------------------------------------------- */
  money: function (pence) {
    var neg = pence < 0;
    var p = Math.abs(Math.round(pence));
    var crowns = Math.floor(p / 240);
    var rem = p % 240;
    var shillings = Math.floor(rem / 12);
    var d = rem % 12;
    var parts = [];
    if (crowns) parts.push(crowns + 'c');
    if (shillings) parts.push(shillings + 's');
    if (d || !parts.length) parts.push(d + 'd');
    return (neg ? '−' : '') + parts.join(' ');
  },

  /* ---- the market -----------------------------------------------------
     Prices move weekly, and they move because of the war. The board by the
     pump shows the player exactly that, in chalk.
     -------------------------------------------------------------------- */
  priceOf: function (id) {
    if (S.market && S.market.prices && typeof S.market.prices[id] === 'number') return S.market.prices[id];
    return BASE_PRICES[id] || (ITEMS[id] ? ITEMS[id].price : 0);
  },

  storePrice: function (id) {
    return Math.max(1, Math.round(Economy.priceOf(id) * STORE_DISCOUNT));
  },

  /* Recomputed at the top of every week. Last week is kept for the board. */
  recomputeMarket: function () {
    var week = Math.floor((S.time.day - 1) / 7) + 1;
    S.market.last = Util.deepClone(S.market.prices || {});
    var prices = {};
    var seasonMods = SEASON_PRICE[S.time.season] || {};
    for (var id in BASE_PRICES) {
      if (!Object.prototype.hasOwnProperty.call(BASE_PRICES, id)) continue;
      var base = BASE_PRICES[id];
      var sens = PRICE_SENSITIVITY[id] || 0.5;
      var warPush = 1 + (S.empire.war / 100) * 0.55 * sens;
      var season = seasonMods[id] || 1;
      var noise = 0.95 + Util.rnd() * 0.11;
      prices[id] = Math.max(1, Math.round(base * warPush * season * noise));
    }
    S.market.prices = prices;
    S.market.week = week;
    /* a labour glut is the other half of a war: more hands than places */
    S.market.wageMult = Util.clamp(1 - S.empire.glut / 260, 0.72, 1);
    if (!S.market.last || !Object.keys(S.market.last).length) S.market.last = Util.deepClone(prices);
    return prices;
  },

  /* What the board by the pump actually says. */
  board: function () {
    var rows = [], id;
    var order = ['bread', 'coal', 'cloth', 'physic', 'laudanum', 'surgeon'];
    for (var i = 0; i < order.length; i++) {
      id = order[i];
      var now = Economy.priceOf(id);
      var was = (S.market.last && S.market.last[id]) || now;
      rows.push({
        id: id,
        now: now,
        was: was,
        delta: now - was,
        store: Economy.storePrice(id)
      });
    }
    return rows;
  },

  canAfford: function (pence) { return S.purse.pennies >= pence; },

  spend: function (pence) {
    if (S.purse.pennies < pence) return false;
    S.purse.pennies -= pence;
    return true;
  },

  /* ---- weekly interest on the store book ------------------------------ */
  compoundDebt: function () {
    if (S.purse.debt <= 0) return 0;

    S.purse.debt += add;

  /* ---- the docket ------------------------------------------------------
     Built fresh each night from S. Lines carry string KEYS, never English,
     so a docket survives being saved and reloaded.

  buildDocket: function () {
