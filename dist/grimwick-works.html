  /* ---------------------------------------------------------- the shift
     A short column of beat-lines, paced, then the tally. Skippable at any
     point. It should read like a bad day, not a spreadsheet.
     ------------------------------------------------------------------- */
  playShift: function (rec, onDone) {
    var scrim, col, skipBtn, finished = false;
    var timers = [];
    var STEP = 380;

    var m = el('div', 'modal modal--shift');
    var head = el('div', 'modal__head');
    head.appendChild(el('span', null, T('shift.stations.' + rec.station + '.name')));
    m.appendChild(head);
    var body = el('div', 'modal__body');
    col = el('div', 'beats');
    col.setAttribute('aria-live', 'polite');
    body.appendChild(col);
    var footer = el('div', 'actions');
    skipBtn = UI.button({
      id: 'btn-skip-beats', small: true,
      label: T('shift.skipBeats'),
      onClick: function () { finish(); }
    });
    footer.appendChild(skipBtn);
    body.appendChild(footer);
    m.appendChild(body);
    scrim = UI.openModal(m);

    function line(beat) {
      var txt = beat.text || T(beat.key);
      var node = el('div', 'beat' + (beat.kind ? ' beat--' + beat.kind : ''), txt);
      col.appendChild(node);
      col.scrollTop = col.scrollHeight;
      Audio.beat(beat.kind);
    }

    for (var i = 0; i < rec.beats.length; i++) {
      (function (idx) {
        timers.push(setTimeout(function () {
          if (finished) return;
          line(rec.beats[idx]);
          if (idx === rec.beats.length - 1) timers.push(setTimeout(finish, 520));
        }, idx * STEP));
      })(i);
    }

    function finish() {
      if (finished) return;
      finished = true;
      for (var t = 0; t < timers.length; t++) clearTimeout(timers[t]);
      /* anything not yet shown lands at once */
      clear(col);
      for (var b = 0; b < rec.beats.length; b++) {
        var beat = rec.beats[b];
        col.appendChild(el('div', 'beat' + (beat.kind ? ' beat--' + beat.kind : ''), beat.text || T(beat.key)));
      }
      clear(footer);
      UI.shiftAftermath(body, rec, function () {
        UI.closeModal(scrim);
        if (onDone) onDone();
      });
      body.scrollTop = body.scrollHeight;
    }
  },

  shiftAftermath: function (body, rec, onDone) {
    /* the catastrophe, if the shed had one */
    if (rec.catastrophe) {
      var cat = el('div', 'catastrophe');

/* ==========================================================================
   TUTORIAL — days 1-2, five steps, interruptible, skippable, replayable.
   ========================================================================== */
var TUTORIAL_STEPS = [
  { phase: 'SHIFT',   target: '#objectives' },
  { phase: 'SHIFT',   target: '#btn-work' },
  { phase: 'EVENING', target: '#evening-panel' },
  { phase: 'NIGHT',   target: '#night-panel' },
  { phase: 'DOCKET',  target: '#docket' }
];

var Tutorial = {
  node: null,

  visible: function () { return !!Tutorial.node; },

  onPhase: function (phase) {
    if (!S.tutorial.active || S.tutorial.done) return;
    if (S.time.day > 2) { S.tutorial.active = false; return; }
    Tutorial.showFor(phase);
  },

  onDocket: function () {
    if (!S.tutorial.active || S.tutorial.done) return;
    if (S.time.day > 2) { S.tutorial.active = false; return; }
    Tutorial.showFor('DOCKET');
  },

  onDocketClosed: function () { Tutorial.hide(); },

  showFor: function (phase) {
    var step = TUTORIAL_STEPS[S.tutorial.step];
    if (!step || step.phase !== phase) return;
    /* wait a tick so the phase panel exists in the document */
    setTimeout(function () { Tutorial.show(S.tutorial.step); }, 0);
  },

  show: function (i) {
    Tutorial.hide();
    var step = TUTORIAL_STEPS[i];
    var copy = T('tutorial.steps')[i];
    if (!step || !copy) return;

    var target = document.querySelector(step.target);
    var box = el('div', 'tut fade-in');
    box.appendChild(el('div', 'tut__title', copy.title));
    box.appendChild(el('div', 'tut__text', copy.text));

    var foot = el('div', 'tut__foot');
    foot.appendChild(el('span', 'tut__count', (i + 1) + ' / ' + TUTORIAL_STEPS.length));
    var btns = el('div', 'actions actions--row');
    btns.appendChild(UI.button({
      small: true, label: T('app.skipTutorial'), hint: T('tutorial.skipAll'),
      onClick: function () {
        S.tutorial.active = false;
        S.tutorial.done = true;
        Tutorial.hide();
      }
    }));
    btns.appendChild(UI.button({
      small: true, primary: true,
      label: i === TUTORIAL_STEPS.length - 1 ? T('app.tutorialDone') : T('app.tutorialNext'),
      onClick: function () { Tutorial.advance(); }
    }));
    foot.appendChild(btns);
    box.appendChild(foot);

    document.body.appendChild(box);
    Tutorial.node = box;

    if (target) {
      target.classList.add('tut-target');
      var r = target.getBoundingClientRect();
      var top = Math.max(8, Math.min(window.innerHeight - box.offsetHeight - 8, r.top));
      var left = r.left - box.offsetWidth - 16;
      if (left < 8) left = Math.min(window.innerWidth - box.offsetWidth - 8, r.right + 16);
      if (left < 8) left = 8;
      box.style.top = top + 'px';
      box.style.left = left + 'px';
    } else {
      box.style.right = '16px';
      box.style.bottom = '16px';
    }
  },

  advance: function () {
    var wasStep = S.tutorial.step;
    S.tutorial.step += 1;
    Tutorial.hide();
    if (S.tutorial.step >= TUTORIAL_STEPS.length) {
      S.tutorial.done = true;
      S.tutorial.active = false;
      return;
    }
    var next = TUTORIAL_STEPS[S.tutorial.step];
    var prev = TUTORIAL_STEPS[wasStep];
    /* chain within the same phase; otherwise wait for that phase to arrive */
    if (next.phase === prev.phase && next.phase !== 'DOCKET') Tutorial.show(S.tutorial.step);
  },

  hide: function () {
    if (Tutorial.node && Tutorial.node.parentNode) Tutorial.node.parentNode.removeChild(Tutorial.node);
    Tutorial.node = null;
    var marked = document.querySelectorAll('.tut-target');
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove('tut-target');
  },

  restart: function () {
    S.tutorial.active = true;
    S.tutorial.done = false;
    /* start at the first step that belongs to the phase we are actually in,
       so replaying from the menu never leaves the player looking at nothing */
    S.tutorial.step = 0;
    for (var i = 0; i < TUTORIAL_STEPS.length; i++) {
      if (TUTORIAL_STEPS[i].phase === S.time.phase) { S.tutorial.step = i; break; }
    }
    UI.log(T('tutorial.replayed'));
    Tutorial.show(S.tutorial.step);
  }
};

/* ==========================================================================
   GRIMWICK WORKS — js/loop.js
   The day machine: SHIFT -> EVENING -> NIGHT -> docket -> the next one.
   Every transition is an explicit call. Nothing advances behind your back.
   ========================================================================== */

var Loop = {

  /* A child who cannot be left alone costs you an hour of every evening. */
  apMax: function () {
    var base = 2;
    var k = State.kin();
    if (k && k.needsMinding && k.status !== 'DEAD' && k.status !== 'TAKEN') base -= 1;
    return Math.max(1, base);
  },

  /* Discharge is processed overnight, because everything there is. */
  workhouseMorning: function () {
    if (!S.destitution.workhouse) return;
    S.destitution.workhouseDays += 1;
    if (S.destitution.applied) {
      S.destitution.workhouse = false;
      S.destitution.applied = false;
      S.house.node = 'street';
      S.evening.at = 'rows';
      UI.log(T('destitution.discharged'), 'good');
    }
  },

  /* ---- boot ----------------------------------------------------------- */
  newGame: function (seed, kinId) {
    S = newState(seed);
    Loop.chooseKin(kinId || 'sister');
    Economy.recomputeMarket();
    UI.log(T('log.dayBegins', {
      d: S.time.day,
      season: T('seasons.' + S.time.season),
      weather: T('weather.' + S.time.weather)
    }), 'head');
    Loop.startDay(true);
  },

  /* Chosen once, at the start, and never chosen again. */
  chooseKin: function (kinId) {
    var opt = null;
    for (var i = 0; i < KIN_OPTIONS.length; i++) if (KIN_OPTIONS[i].id === kinId) opt = KIN_OPTIONS[i];
    if (!opt) opt = KIN_OPTIONS[0];
    S.house.kin = [Util.deepClone(opt.kin)];
    S.flags.kinKind = opt.id;
    if (opt.apply) opt.apply(S);
    S.evening.apMax = Loop.apMax();
    S.evening.ap = S.evening.apMax;
  },

  resumeLoaded: function () {
    UI.render();
    if (S.dead) UI.showEnding(S.endingId);
  },

  /* ---- day ------------------------------------------------------------ */
  startDay: function (isFirst) {
    S.time.season = Util.seasonFor(S.time.day);
    S.time.act = Util.actFor(S.time.day);
    S.time.weather = Util.pick(WEATHERS[S.time.season]);
    S.time.phase = 'SHIFT';

    S.factory.worked = false;
    S.factory.lastOutcome = null;
    S.evening.apMax = Loop.apMax();
    S.evening.ap = S.evening.apMax;
    S.evening.at = S.destitution.workhouse ? 'workhouse' : 'rows';
    S.evening.travelled = 0;
    S.evening.ended = false;
    S.evening.rested = false;
    S.night.resolved = false;
    S.night.share = null;
    S.flags.dressedToday = 0;
    S.docket = null;
    if (S.time.day % 7 === 1) S.house.coatMended = false;

    /* the week turns: the war moves, and the market with it */
    if ((S.time.day - 1) % 7 === 0 || !S.market.prices || !S.market.prices.bread) {
      Empire.week();
      S.flags.drinksThisWeek = 0;
    }
    Empire.tick();
    Coom.tick();
    Loop.workhouseMorning();
    Factory.assignStation();
    Factory.assignOrder();
    Empire.releaseCheck();
    S.pending.pieceWage = 0;

    if (!isFirst) {
      UI.log(T('log.dayBegins', {
        d: S.time.day,
        season: T('seasons.' + S.time.season),
        weather: T('weather.' + S.time.weather)
      }), 'head');
    }
    UI.log(T('log.phaseShift'));
    UI.render();
    Tutorial.onPhase('SHIFT');
    if (S.flags.spitedToStation) {
      S.flags.spitedToStation = false;
      UI.log(T('foreman.spiteNotice'), 'bad');
    }

    /* the acts turn on the calendar or on the world, whichever comes first */
    var turn = Acts.check();
    if (turn) {
      UI.showActCard(turn, function () {
        Loop.morningPressure();
        UI.render();
      });
      return;
    }
    Loop.morningPressure();
  },

  /* Everything the world does to you before you have had breakfast. */
  morningPressure: function () {
    if (S.dead) return;

    /* the regiment leaves whether or not you are ready */
    if (S.flags.enlisted && S.time.day >= S.flags.departureDay) {
      S.endingId = 'the_shilling';
      UI.showEnding('the_shilling');
      return;
    }

    /* names you gave come back with what happened to them attached */
    var fates = Endings.fatesToShow();
    if (fates.length && (S.time.act >= 3 || S.time.day - fates[0].day >= 9)) {
      Endings.assignFates();
      UI.showFates(Endings.fatesToShow());
    }

    if (Coom.inspectorDue()) { UI.showInspector(); return; }

    var g = Empire.garrisonDay();
    if (!g) { UI.render(); return; }

    if (g.kind === 'hanged') {
      S.flags.condemned = true;
      S.endingId = 'the_drop';
      UI.showGarrison(g, function () { UI.showEnding('the_drop'); });
      return;
    }
    if (g.kind === 'arrested') {
      Empire.arrest(S.tracks.union.joined || S.flags.carryingPrint ? 'sedition' : 'suspicion');
      UI.showGarrison(g, function () { UI.render(); });
      return;
    }
    if (g.kind === 'searched') {
      var found = g.found;
      if (found.length) {
        /* the floorboard trick is in a manual somewhere */
        var hidden = S.flags.hasStash && Util.chance(0.45);
        if (!hidden) {
          State.applyStanding({ notice: 14, garrison: -10 });
          State.addFine('talk');
          S.flags.carryingPrint = false;
          S.flags.holdingParcel = false;
          S.flags.contrabandFound = true;
        } else {
          g.missed = true;
        }
      }
      UI.showGarrison(g, function () { UI.render(); });
      return;
    }
    if (g.kind === 'pressgang') {
      S.tracks.enlist.joined = true;
      S.tracks.enlist.known = true;
      S.flags.enlisted = true;
      S.flags.pressed = true;
      S.flags.departureDay = S.time.day + 2;
      UI.showGarrison(g, function () { UI.render(); });
      return;
    }
    UI.showGarrison(g, function () { UI.render(); });
  },

  /* ---- shift ---------------------------------------------------------- */
  /* Held. The day is spent, and the shifts are not made up. */
  holdDay: function () {
    if (!S.arrest) return;
    S.factory.worked = false;
    S.factory.lastOutcome = 'held';
    State.applyBody({ hunger: 18, warmth: -8, fatigue: 4 });
    State.applyMind({ resolve: -4 });
    S.time.phase = 'NIGHT';
    UI.log(T('garrison.arrested.cells'), 'bad');
    UI.render();
    Tutorial.onPhase('NIGHT');
  },

  /* Enlisted, and not gone yet. */
  drill: function () {
    if (!S.flags.enlisted || S.factory.lastOutcome === 'drill') return;
    S.factory.worked = false;
    S.factory.lastOutcome = 'drill';
    State.applyBody({ fatigue: 16, hunger: -22, warmth: 6, health: 1 });
    State.applyMind({ resolve: 2 });
    S.flags.drilled = (S.flags.drilled || 0) + 1;
    UI.showResult(T('enlist.drillResult'), function () { UI.render(); });
  },

  work: function () {
    if (S.time.phase !== 'SHIFT' || S.factory.worked) return;
    if (Factory.canWork() !== true) return;
    /* the bench game first, if it is switched on; it only sets how the hands
       went, and the shift resolves off that exactly as it always has */
    if (Minigames.enabled()) {
      Minigames.play(S.factory.station, function (q) {
        S.factory.handQuality = q;
        Loop.resolveWorkedShift();
      });
      return;
    }
    S.factory.handQuality = 0.5;
    Loop.resolveWorkedShift();
  },

  resolveWorkedShift: function () {
    var rec = Factory.resolveShift();
    Audio.shiftStart(rec.station);
    UI.playShift(rec, function () {
      Audio.shiftEnd();
      Loop.checkDeath();
      if (S.dead) { UI.showEnding(S.endingId); return; }
      Loop.afterShiftAction();
    });
  },

  setDial: function (kind, value) {
    if (Factory.setDial(kind, value)) UI.render();
  },

  askTransfer: function (to) {
    var res = Factory.requestTransfer(to);
    UI.showResult(T(res.key), function () { UI.render(); });
    Audio.dial();
  },

  foremanChoice: function (id) {
    var key = Coom.choose(id);
    if (!key) { UI.render(); return; }
    UI.showResult(T(key), function () { UI.render(); });
  },

  skip: function () {
    if (S.time.phase !== 'SHIFT' || S.factory.worked) return;
    Factory.skipShift();
    S.factory.worked = false;
    S.factory.lastOutcome = 'absent';
    S.evening.ended = false;
    /* an absent day still ends: you go out into the evening either way */
    UI.render();
  },

  gateWait: function () {
    if (S.time.phase !== 'SHIFT') return;
    var res = Factory.waitAtGate();
    UI.showResult(T('shift.' + (res === 'casual_got' ? 'casualGot' : 'casualNone')), function () {
      Loop.checkDeath();
      UI.render();
    });
  },

  afterShiftAction: function () {
    var evt = Events.roll('SHIFT');
    if (evt) {
      UI.showEvent(evt, function () { Loop.checkDeath(); UI.render(); });
    } else {
      Loop.checkDeath();
      UI.render();
    }
  },

  toEvening: function () {
    if (S.time.phase !== 'SHIFT') return;
    S.time.phase = 'EVENING';
    Audio.place(S.evening.at);
    UI.log(T('log.phaseEvening'));
    UI.render();
    Tutorial.onPhase('EVENING');
    var evt = Events.roll('EVENING', Town.here());
    if (evt) UI.showEvent(evt, function () { Loop.checkDeath(); UI.render(); });
  },

  /* ---- evening -------------------------------------------------------- */
  travel: function (nodeId) {
    if (S.time.phase !== 'EVENING') return;
    if (Town.travelTo(nodeId)) UI.render();
  },

  act: function (actionId) {
    if (S.time.phase !== 'EVENING') return;
    var res = Town.perform(actionId);
    if (!res) { UI.render(); return; }
    if (res.open) {
      if (res.open === 'board') UI.showBoard();
      else if (res.open === 'ledger') UI.showLedger();
      else if (res.open === 'advice') UI.showAdvice();
      else if (res.open === 'broadsheet') UI.showBroadsheet(false);
      else if (res.open === 'broadsheetAloud') UI.showBroadsheet(true);
      else if (res.open === 'inform') UI.showInform();
      else UI.showPawn(res.open);
      UI.render();
      return;
    }
    if (!res.text) { UI.render(); return; }
    UI.showResult(res.text, function () { Loop.checkDeath(); UI.render(); });
  },

  endEvening: function () {
    if (S.time.phase !== 'EVENING') return;
    S.evening.ended = true;
    S.time.phase = 'NIGHT';
    UI.log(T('log.phaseNight'));
    UI.render();
    Tutorial.onPhase('NIGHT');
    var evt = Events.roll('NIGHT');
    if (evt) UI.showEvent(evt, function () { Loop.checkDeath(); UI.render(); });
  },

  /* ---- night ---------------------------------------------------------- */
  needsShareChoice: function () {
    var k = State.kin();
    return !!k && k.status !== 'DEAD' && S.house.larder === 1;
  },

  bedDown: function (share) {
    if (S.time.phase !== 'NIGHT' || S.night.resolved) return;
    S.night.share = share || null;
    Loop.resolveNight();
  },

  resolveNight: function () {
    var k = State.kin();
    var alive = !!k && k.status !== 'DEAD';
    var bite = WEATHER_BITE[S.time.weather] || 6;

    /* the body charges rent too, and it charges it nightly */
    State.applyBody({ hunger: 6 });

    /* --- eating --- */
    var needed = alive ? 2 : 1;
    if (S.house.larder >= needed) {
      S.house.larder -= needed;
      State.applyBody({ hunger: -30 });
      if (alive) State.applyKin({ health: 3, mood: 3 });
      UI.log(T('night.ate'));
    } else if (S.house.larder === 1 && alive) {
      S.house.larder = 0;
      if (S.night.share === 'kin') {
        State.applyKin({ health: 6, mood: 6 });
        State.applyBody({ hunger: 16 });
        State.applyMind({ resolve: 3 });
        UI.log(T('night.kinAte'));
      } else if (S.night.share === 'split') {
        State.applyKin({ health: 1, mood: 2 });
        State.applyBody({ hunger: -14 });
        UI.log(T('night.sharedHalf'));
      } else {
        State.applyBody({ hunger: -28 });
        State.applyKin({ health: -7, mood: -8 });
        State.applyMind({ resolve: -4 });
        UI.log(T('night.youWentWithout'));
      }
    } else if (S.house.larder === 1) {
      S.house.larder = 0;
      State.applyBody({ hunger: -30 });
      UI.log(T('night.ate'));
    } else {
      State.applyBody({ hunger: 20, health: -3 });
      S.body.lastHarm = 'starve';
      if (alive) State.applyKin({ health: -7, mood: -6 });
      UI.log(T('night.ateNothing'), 'bad');
    }

    /* a stocked larder is no use to a starving man who will not open it */
    if (S.body.hunger > 55 && S.house.larder >= 1) {
      S.house.larder -= 1;
      State.applyBody({ hunger: -18 });
      UI.log(T('night.secondHelping'));
    }

    /* --- no room, no fire, no argument --- */
    if (!S.house.housed && !S.destitution.workhouse) {
      var rough = Math.round(bite * 1.5) - (S.flags.grateTonight ? 8 : 0) - State.goodsWarmth();
      State.applyBody({ warmth: -Math.max(4, rough), health: -3, fatigue: 6 });
      if (S.body.warmth < 30) S.body.lastHarm = 'cold';
      S.destitution.days += 1;
      if (State.kinPresent()) State.applyKin({ health: -6, mood: -8 });
      UI.log(T('destitution.sleptRough'), 'bad');
      S.flags.grateTonight = false;
      Loop.poorhouseRisk();
    } else if (S.destitution.workhouse) {
      /* the house feeds you, houses you, and takes everything else */
      State.applyBody({ hunger: -30, warmth: 30, health: 1, fatigue: -20 });
      State.applyMind({ resolve: -4 });
      UI.log(T('destitution.workhouseNight'));
    } else if (S.house.coal > 0) {
      S.house.coal -= 1;
      State.applyBody({ warmth: 24 - Math.floor(bite / 3) });
      UI.log(T('night.burned'));
    } else {
      State.applyBody({ warmth: -bite + State.goodsWarmth(), health: bite > 12 ? -3 : -1 });
      if (S.body.warmth < 30) S.body.lastHarm = 'cold';
      if (alive) State.applyKin({ health: bite > 12 ? -5 : -2 });
      UI.log(T('night.noCoal'), 'bad');
    }
    if (S.house.housed) State.applyBody({ warmth: -Math.floor(bite / 2) });

    /* --- sleep --- */
    var rest = 34;
    if (S.body.hunger > 70) rest -= 10;
    if (S.body.warmth < 28) rest -= 10;
    if (S.body.injury) rest -= 6;
    State.applyBody({ fatigue: -Math.max(8, rest) });
    if (rest >= 28 && !S.body.injury && S.body.hunger < 50 && S.body.warmth > 55) {
      /* the only thing that mends you here is an ordinary night, and they
         are not ordinary often */
      State.applyBody({ health: 3 });
      S.body.lastHarm = null;
    }
    UI.log(T(rest >= 28 ? 'night.slept' : 'night.sleptBadly'));

    /* --- the wound, and what gets into it --- */
    if (S.body.injury) {
      var inj = S.body.injury;
      if (typeof inj.infection !== 'number') inj.infection = 0;

      if (S.flags.surgeonDay === S.time.day) {
        /* the apothecary cut away what was dead and dressed it properly */
        inj.infection = 0;
        inj.fever = false;
        inj.daysLeft = Math.max(1, inj.daysLeft - 2);
      } else {
        var care = S.flags.dressedToday || 0;          /* 0 nothing, 1 rag, 2 bottle */
        var gain = Util.rndInt(11, 19) - care * 10;
        /* a clean dressing on a warm, fed body holds the line. that is the
           whole of nineteenth-century wound care and it is nearly enough.
           An undressed wound gets no benefit from any of it. */
        if (care > 0 && S.body.warmth > 50 && S.body.hunger < 62) gain -= 4;
        if (S.house.physic > 0) gain -= 2;
        if (S.body.warmth < 30) gain += 5;
        if (S.body.hunger > 70) gain += 5;
        if (inj.severity >= 4) gain += 4;
        inj.infection = Util.clamp(inj.infection + gain, 0, 100);
      }

      if (!inj.fever && inj.infection >= 55) {
        inj.fever = true;
        UI.log(T('fever.onset'), 'bad');
      } else if (inj.fever && inj.infection < 35) {
        inj.fever = false;
        UI.log(T('fever.breaking'), 'good');
      }

      if (inj.fever) {
        State.applyBody({ health: -7, fatigue: 8 });
        State.applyMind({ resolve: -3 });
        S.body.lastHarm = 'injury';
        UI.log(T(inj.infection >= 85 ? 'fever.tooLate' : 'fever.burning'), 'bad');
      } else if (inj.infection >= 30) {
        State.applyBody({ health: -2 });
        S.body.lastHarm = 'injury';
        UI.log(T('night.woundWorse'), 'bad');
      } else {
        inj.daysLeft -= 1;
        if (inj.daysLeft <= 0) {
          UI.log(T('log.healed', { what: T('injuries.' + inj.type) }), 'good');
          if (inj.permanent) State.applyBody({ tremor: 4 });
          S.body.injury = null;
        }
      }
    }

    /* --- the chest --- */
    if (S.body.dust > 45 && Util.chance(S.body.dust / 300)) {
      State.applyBody({ health: -3 });
      S.body.lastHarm = 'sick';
      UI.log(T('night.coughing'), 'bad');
    }

    /* --- kin --- */
    if (alive) {
      if (k.status === 'FEVERED' && Util.chance(0.3)) {
        State.applyKin({ health: 8 });
        UI.log(T('night.kinBetter'), 'good');
      } else if (k.health < 55) {
        UI.log(T('night.kinWorse'));
      }
      /* a death in the house is announced by State.applyKin, wherever it falls */
    }

    /* --- what the kin did with the day --- */
    Loop.kinUpkeep();

    /* --- rent --- */
    if (S.house.housed && S.time.day === S.house.rentDue) {
      if (S.house.rentPaidFor === S.house.rentDue) {
        S.flags.rentPaidEarly = false;
        UI.log(T('night.rentPaid'));
      } else if (S.purse.pennies >= S.house.rentAmount) {
        S.purse.pennies -= S.house.rentAmount;
        UI.log(T('night.rentPaid'));
        UI.log(T('log.spent', { amt: Economy.money(S.house.rentAmount) }));
      } else {
        var short = S.house.rentAmount - S.purse.pennies;
        S.purse.pennies = 0;
        S.house.arrears += short;
        S.house.rentMissed += 1;
        S.flags.rentAtSource = true;
        State.applyMind({ resolve: -6 });
        UI.log(T('night.rentMissed'), 'bad');
        if (S.house.rentMissed >= RENT.missesToEviction) Loop.evict();
      }
      S.house.rentDue += WAGE.rentEvery;
    }

    /* --- the store book grows on Sundays --- */
    if (S.time.day % 7 === 0) {
      var added = Economy.compoundDebt();
      if (added > 0) UI.log(T('log.debtUp', { amt: Economy.money(S.purse.debt) }), 'bad');
    }

    /* --- the week's count, every seventh night --- */
    if (S.time.day % 7 === 0 && S.job.employed) Factory.quotaRollover();

    S.night.resolved = true;
    Loop.checkDeath();
    Loop.issueDocket();
  },

  /* ---- the household -------------------------------------------------- */
  kinUpkeep: function () {
    var k = State.kin();
    if (!k || k.status === 'DEAD' || k.status === 'TAKEN') return;

    /* the sister on the cap bench: six pence, and the shake, which is hers now */
    if (k.working && S.job.employed) {
      S.pending.kinWage = (S.pending.kinWage || 0) + 6;
      k.tremor = Util.clamp((k.tremor || 0) + 2, 0, 100);
      State.applyKin({ health: -1, mood: -1 });
      if (k.tremor >= 40 && !S.flags.kinTremorNoted) {
        S.flags.kinTremorNoted = true;
        UI.log(T('kin.tremorNoted', { name: k.name }), 'bad');
      }
    }

    /* the father's lungs: a week's medicine, or the week takes it out of him */
    if (k.chronic === 'lungs') {
      if (S.time.day % 7 === 0) {
        if (S.house.physic > 0) {
          S.house.physic -= 1;
          State.applyKin({ health: 6, mood: 3 });
          UI.log(T('kin.medicineGiven', { name: k.name }));
        } else {
          State.applyKin({ health: -9, mood: -4 });
          UI.log(T('kin.medicineMissed', { name: k.name }), 'bad');
        }
      } else {
        State.applyKin({ health: -1 });
      }
    }

    /* the child, left alone all evening */
    if (k.needsMinding && S.evening.travelled > 0 && S.flags.mindedDay !== S.time.day) {
      State.applyKin({ mood: -6, health: -2 });
      UI.log(T('kin.leftAlone', { name: k.name }), 'bad');
    }

    if (S.flags.tendedToday) { S.flags.tendedToday = false; }
  },

  evict: function () {
    if (!S.house.housed) return;
    S.house.housed = false;
    S.house.node = 'street';
    S.destitution.ever = true;
    S.house.rentMissed = 0;
    S.house.coatMended = false;
    /* what was not under the floorboard is on the street, and then it is gone */
    var kept = [], lost = 0, i;
    for (i = 0; i < S.house.goods.length; i++) {
      if (S.house.goods[i].stashed) kept.push(S.house.goods[i]); else lost++;
    }
    S.house.goods = kept;
    S.house.coal = 0;
    S.flags.evicted = (S.flags.evicted || 0) + 1;
    State.applyMind({ resolve: -18 });
    UI.log(T('destitution.evicted', { n: lost }), 'bad');
    Loop.poorhouseRisk();
  },

  /* Children of the destitute are taken. It is lawful and it is routine. */
  poorhouseRisk: function () {
    var k = State.kin();
    if (!k || k.status === 'DEAD' || k.status === 'TAKEN') return;
    if (S.house.housed) return;
    var risk = 0.12 + (k.health < 40 ? 0.15 : 0) + (S.destitution.days > 4 ? 0.12 : 0);
    if (Util.chance(risk)) {
      k.status = 'TAKEN';
      S.destitution.kinTaken = true;
      S.flags.kinTaken = true;
      State.applyMind({ resolve: -20 });
      UI.log(T('kin.takenByParish', { name: k.name }), 'bad');
    }
  },

  /* ---- the docket ----------------------------------------------------- */
  issueDocket: function () {
    var docket = Economy.settle(Economy.buildDocket());
    if (!S.dead) Save.autosave();
    UI.showDocket(docket, function () {
      if (S.dead) { UI.showEnding(S.endingId); return; }
      if (S.factory.quota.unseen && S.factory.quota.lastResult) {
        var q = S.factory.quota.lastResult;
        S.factory.quota.unseen = false;
        UI.showQuota(q, function () {
          if (q.dismissed) { UI.showResult(T('shift.quota.dismissal'), function () { Loop.nextDay(); }); }
          else Loop.nextDay();
        });
        return;
      }
      Loop.nextDay();
    });
  },

  nextDay: function () {
    if (S.time.day >= 60) {
      S.endingId = Endings.pick();
      UI.showEnding(S.endingId);
      return;
    }
    var wasDay = S.time.day;
    S.time.day += 1;
    Loop.startDay(false);
    if (wasDay === 10) UI.showMilestone();
  },

  /* ---- death ---------------------------------------------------------- */
  checkDeath: function () {
    if (S.flags.condemned && !S.dead) { S.endingId = 'the_drop'; return false; }
    if (S.dead) return true;
    if (S.settings.god) {
      if (S.body.health <= 0) S.body.health = 1;
      return false;
    }
    if (S.body.health <= 0) {
      S.body.health = 0;
      S.dead = true;
      S.endingId = Narrative.deathId();
      return true;
    }
    return false;
  },

  /* Used by the ending screen and the menu. */
  restart: function () {
    UI.closeAll();
    S.log = [];
    UI.showCreation(function (kinId) { Loop.newGame(null, kinId); });
  }
};

;
/* ---- js/debug.js ---- */
/* ==========================================================================
   GRIMWICK WORKS — js/debug.js
   Tilde opens it. Sets any field in S, jumps any day, forces any event,
   god mode, and a save round-trip deep-compare. Never shown to a player.
   ========================================================================== */

var Debug = {
  open: false,
  node: null,
  filter: '',

  toggle: function () {
    Debug.open = !Debug.open;
    if (Debug.open) Debug.build(); else Debug.destroy();
  },

  destroy: function () {
    if (Debug.node && Debug.node.parentNode) Debug.node.parentNode.removeChild(Debug.node);
    Debug.node = null;
  },

  refresh: function () {
    if (Debug.open) { Debug.destroy(); Debug.build(); }
  },

  /* ---- reflective walk over S: every primitive leaf gets a control ---- */
  leaves: function (obj, path, out, depth) {
    out = out || [];
    depth = depth || 0;
    if (depth > 6) return out;
    for (var k in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
      if (path === '' && (k === 'log' || k === 'dockets' || k === 'docket')) continue;
      var v = obj[k];
      var p = path ? path + '.' + k : k;
      if (v === null) { out.push({ path: p, type: 'null', value: v }); continue; }
      if (typeof v === 'object') { Debug.leaves(v, p, out, depth + 1); continue; }
      out.push({ path: p, type: typeof v, value: v });
    }
    return out;
  },

  setPath: function (root, path, value) {
    var parts = path.split('.'), node = root, i;
    for (i = 0; i < parts.length - 1; i++) node = node[parts[i]];
    node[parts[parts.length - 1]] = value;
  },

  /* 200 shifts per dial setting, printed to the console. The point is to see
     that pace, care and guard actually bend the curves in different directions. */
  monteCarlo: function (n) {
    n = n || 200;
    var keep = Util.deepClone(S);
    var quietLog = UI.log;
    UI.log = function () {};
    var rows = [];

    function trial(station, pace, care, guard) {
      var o = 0, g = 0, w = 0, c = 0, hurt = 0, cat = 0, fat = 0;
      /* each row gets its own seed stream, or every row draws the same dice
         and the rare events look identical when they are not */
      var seedBase = 9000 + rows.length * 104729;
      for (var i = 0; i < n; i++) {
        S = newState(seedBase + i * 13);
        S.settings.audio = false;
        S.factory.station = station;
        S.factory.skills[station] = 50;
        S.factory.pace = pace; S.factory.care = care; S.factory.guard = guard;
        var f0 = S.body.fatigue;
        var rec = Factory.resolveShift();
        o += rec.output; g += rec.good; w += rec.wage; c += rec.credits;
        fat += S.body.fatigue - f0;
        if (rec.injury) hurt++;
        if (rec.catastrophe) cat++;
      }
      rows.push({
        station: station, dials: pace + '/' + care + '/' + guard,
        made: Math.round(o / n), passed: Math.round(g / n),
        wage: Math.round(w / n * 10) / 10, count: Math.round(c / n),
        fatigue: Math.round(fat / n),
        injuryPct: Math.round(hurt / n * 1000) / 10,
        catPct: Math.round(cat / n * 1000) / 10
      });
    }

    var st, i;
    for (i = 0; i < STATIONS.length; i++) trial(STATIONS[i], 'steady', 'proper', 'on');
    for (i = 0; i < 3; i++) trial('STAMPING', ['slow', 'steady', 'driven'][i], 'proper', 'on');
    for (i = 0; i < 3; i++) trial('STAMPING', 'steady', ['sloppy', 'proper', 'meticulous'][i], 'on');
    trial('STAMPING', 'steady', 'proper', 'off');

    S = keep;
    UI.log = quietLog;
    if (console.table) console.table(rows); else console.log(rows);
    UI.log(T('debug.monteDone', { n: n }), 'good');
    UI.render();
    return rows;
  },

  build: function () {
    var wrap = el('div', 'debug');
    var head = el('div', 'debug__head');
    head.appendChild(el('span', null, T('debug.title')));
    head.appendChild(el('span', null, T('debug.hint')));
    wrap.appendChild(head);

    var body = el('div', 'debug__body');

    /* --- tools --- */
    var tools = el('div', 'actions');

    var godRow = el('div', 'debug__row');
    var godLabel = el('label', null, T('debug.god'));
    var god = document.createElement('input');
    god.type = 'checkbox';
    god.checked = !!S.settings.god;
    god.addEventListener('change', function () { S.settings.god = god.checked; });
    godRow.appendChild(godLabel);
    godRow.appendChild(god);
    body.appendChild(godRow);

    var dayRow = el('div', 'debug__row');
    dayRow.appendChild(el('label', null, T('debug.jumpDay')));
    var dayIn = document.createElement('input');
    dayIn.type = 'number';
    dayIn.min = '1';
    dayIn.max = '60';
    dayIn.value = String(S.time.day);
    dayIn.addEventListener('change', function () {
      var d = Util.clamp(parseInt(dayIn.value, 10) || 1, 1, 60);
      S.time.day = d;
      Loop.startDay(false);
      Debug.refresh();
    });
    dayRow.appendChild(dayIn);
    body.appendChild(dayRow);

    var evRow = el('div', 'debug__row');
    evRow.appendChild(el('label', null, T('debug.forceEvent')));
    var sel = document.createElement('select');
    var ids = Events.ids();
    for (var i = 0; i < ids.length; i++) {
      var o = document.createElement('option');
      o.value = ids[i];
      o.textContent = ids[i];
      sel.appendChild(o);
    }
    evRow.appendChild(sel);
    body.appendChild(evRow);

    tools.appendChild(UI.button({
      small: true, label: T('debug.fire'),
      onClick: function () { Events.force(sel.value, function () { UI.render(); }); }
    }));
    tools.appendChild(UI.button({
      small: true, label: T('debug.roundTrip'),
      onClick: function () {
        var diff = Save.roundTripTest();
        if (diff.length === 0) {
          console.log('%c' + T('debug.passed'), 'color:#8fbb85');
          UI.log(T('debug.passed'), 'good');
        } else {
          console.warn(T('debug.failed'), diff);
          UI.log(T('debug.failed'), 'bad');
        }
      }
    }));
    tools.appendChild(UI.button({
      small: true, label: T('debug.monteCarlo'),
      onClick: function () { Debug.monteCarlo(200); }
    }));
    tools.appendChild(UI.button({
      small: true, label: T('debug.permCheck'),
      onClick: function () {
        var before = State.permanentSnapshot();
        State.applyBody({ dust: -50, tremor: -50, lead: -50 });
        var v = State.assertPermanents(before);
        console.log(v.length ? 'PERMANENCE VIOLATED: ' + v.join(', ') : T('debug.permOk'));
        UI.log(v.length ? T('debug.failed') : T('debug.permOk'), v.length ? 'bad' : 'good');
      }
    }));
    tools.appendChild(UI.button({
      small: true, label: T('debug.dumpState'),
      onClick: function () { console.log(Util.deepClone(S)); }
    }));
    tools.appendChild(UI.button({
      small: true, label: T('debug.kill'),
      onClick: function () { S.body.health = 0; Loop.checkDeath(); UI.showEnding(S.endingId); }
    }));
    body.appendChild(tools);

    /* --- filter --- */
    var fRow = el('div', 'debug__row');
    fRow.appendChild(el('label', null, T('debug.filter')));
    var fIn = document.createElement('input');
    fIn.type = 'text';
    fIn.value = Debug.filter;
    fIn.addEventListener('input', function () {
      Debug.filter = fIn.value;
      Debug.refresh();
      var again = document.querySelector('.debug input[type=text]');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    fRow.appendChild(fIn);
    body.appendChild(fRow);

    /* --- every field in S --- */
    body.appendChild(el('div', 'debug__group', 'S'));
    var leaves = Debug.leaves(S, '', []);
    for (var j = 0; j < leaves.length; j++) {
      (function (leaf) {
        if (Debug.filter && leaf.path.indexOf(Debug.filter) === -1) return;
        var row = el('div', 'debug__row');
        row.appendChild(el('label', null, leaf.path));
        var input = document.createElement('input');
        if (leaf.type === 'boolean') {
          input.type = 'checkbox';
          input.checked = !!leaf.value;
          input.addEventListener('change', function () {
            Debug.setPath(S, leaf.path, input.checked);
            UI.render();
          });
        } else {
          input.type = leaf.type === 'number' ? 'number' : 'text';
          input.value = leaf.value === null ? '' : String(leaf.value);
          input.addEventListener('change', function () {
            var v = input.value;
            if (leaf.type === 'number') v = parseFloat(v) || 0;
            else if (v === 'null') v = null;
            Debug.setPath(S, leaf.path, v);
            UI.render();
          });
        }
        row.appendChild(input);
        body.appendChild(row);
      })(leaves[j]);
    }

    /* injury is the one nullable object: give it a switch of its own */
    body.appendChild(el('div', 'debug__group', 'injury'));
    var injRow = el('div', 'debug__row');
    injRow.appendChild(el('label', null, 'body.injury'));
    var injSel = document.createElement('select');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = 'null';
    injSel.appendChild(none);
    for (var t in STR.injuries) {
      if (Object.prototype.hasOwnProperty.call(STR.injuries, t)) {
        var io = document.createElement('option');
        io.value = t;
        io.textContent = t;
        if (S.body.injury && S.body.injury.type === t) io.selected = true;
        injSel.appendChild(io);
      }
    }
    injSel.addEventListener('change', function () {
      if (!injSel.value) S.body.injury = null;
      else S.body.injury = { type: injSel.value, severity: 2, daysLeft: 4, permanent: false };
      UI.render();
    });
    injRow.appendChild(injSel);
    body.appendChild(injRow);

    wrap.appendChild(body);
    document.body.appendChild(wrap);
    Debug.node = wrap;
  }
};

</script>
<script>
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { UI.boot(); });
  } else {
    UI.boot();
  }
</script>
